<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Deal - 3D Immersive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }

        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #ui-overlay > * { pointer-events: auto; }

        #hud {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 12px 35px;
            border-radius: 20px;
            color: white;
            display: flex;
            gap: 40px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .hud-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        .hud-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

        #player-info {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        #player-info .name { font-size: 20px; font-weight: bold; color: #ffd700; }
        #player-info .turn-text { font-size: 12px; opacity: 0.7; margin-top: 3px; }

        #action-buttons {
            position: absolute;
            bottom: 180px; right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(10,10,10,0.98) 100%);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background: linear-gradient(180deg, rgba(255,215,0,0.25) 0%, rgba(255,215,0,0.1) 100%);
            border-color: #ffd700;
            transform: translateX(-5px);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .action-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

        #card-tooltip {
            position: absolute;
            top: 90px; left: 20px;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            padding: 18px 22px;
            border-radius: 12px;
            color: white;
            min-width: 240px;
            max-width: 280px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #card-tooltip.visible { display: block; }
        #card-tooltip h3 { color: #ffd700; margin-bottom: 8px; font-size: 16px; }
        #card-tooltip p { font-size: 13px; opacity: 0.85; line-height: 1.5; }
        #card-tooltip .value { margin-top: 10px; color: #4CAF50; font-weight: bold; font-size: 14px; }

        #instructions {
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #setup-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a2040 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #setup-screen.hidden { display: none; }
        .setup-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(30px);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            text-align: center;
            max-width: 450px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
        }
        .setup-box h1 { color: #ffd700; font-size: 42px; margin-bottom: 8px; text-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
        .setup-box h2 { color: white; font-size: 16px; font-weight: normal; margin-bottom: 40px; opacity: 0.7; letter-spacing: 4px; }
        .setup-box label { color: white; font-size: 14px; display: block; margin-bottom: 12px; text-align: left; }
        .setup-box select {
            width: 100%; padding: 15px; font-size: 15px; border-radius: 10px;
            border: 2px solid rgba(255, 215, 0, 0.4); background: rgba(0, 0, 0, 0.6);
            color: white; margin-bottom: 30px; cursor: pointer;
        }
        .setup-box select option { background: #1a1a2e; }
        #start-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border: none; color: #000; padding: 18px 50px; font-size: 16px;
            font-weight: bold; border-radius: 12px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 215, 0, 0.7); }

        #winner-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: none;
            align-items: center; justify-content: center; z-index: 2000;
        }
        #winner-screen.visible { display: flex; }
        .winner-box { text-align: center; }
        .winner-box h1 { font-size: 64px; color: #ffd700; text-shadow: 0 0 60px rgba(255, 215, 0, 0.8); margin-bottom: 20px; }
        .winner-box p { font-size: 26px; color: white; margin-bottom: 40px; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 3000;
        }
        #loading.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .loader { width: 60px; height: 60px; border: 4px solid rgba(255, 215, 0, 0.2); border-top-color: #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <p>Loading 3D Environment...</p>
    </div>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>MONOPOLY DEAL</h1>
            <h2>3D FIRST PERSON</h2>
            <label>Number of Players</label>
            <select id="player-count">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>
            <button id="start-btn">Enter Game</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="ui-overlay">
        <div id="player-info">
            <div class="name" id="player-name">Player 1</div>
            <div class="turn-text">Your Turn</div>
        </div>

        <div id="hud">
            <div class="hud-stat">
                <span class="hud-value" id="hud-actions">3</span>
                <span class="hud-label">Actions</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-cards">5</span>
                <span class="hud-label">Hand</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-sets">0/3</span>
                <span class="hud-label">Sets</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-bank">$0M</span>
                <span class="hud-label">Bank</span>
            </div>
        </div>

        <div id="card-tooltip">
            <h3 id="tooltip-title">Card Name</h3>
            <p id="tooltip-desc">Description</p>
            <div class="value" id="tooltip-value">Value: $0M</div>
        </div>

        <div id="action-buttons">
            <button class="action-btn" id="btn-draw">Draw Cards</button>
            <button class="action-btn" id="btn-play">Play Card</button>
            <button class="action-btn" id="btn-bank">Bank Card</button>
            <button class="action-btn" id="btn-end">End Turn</button>
        </div>

        <div id="instructions">Click cards to select • PLAY adds to properties • BANK adds to money pile</div>
    </div>

    <div id="winner-screen">
        <div class="winner-box">
            <h1>🏆 WINNER! 🏆</h1>
            <p id="winner-name">Player 1 Wins!</p>
            <button class="action-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // ==================== CARD DATA ====================
        const CARD_DATA = {
            properties: [
                { name: 'Mediterranean Ave', color: 'brown', value: 1 },
                { name: 'Baltic Ave', color: 'brown', value: 1 },
                { name: 'Oriental Ave', color: 'lightBlue', value: 1 },
                { name: 'Vermont Ave', color: 'lightBlue', value: 1 },
                { name: 'Connecticut Ave', color: 'lightBlue', value: 1 },
                { name: 'St. Charles Pl', color: 'pink', value: 2 },
                { name: 'States Ave', color: 'pink', value: 2 },
                { name: 'Virginia Ave', color: 'pink', value: 2 },
                { name: 'St. James Pl', color: 'orange', value: 2 },
                { name: 'Tennessee Ave', color: 'orange', value: 2 },
                { name: 'New York Ave', color: 'orange', value: 2 },
                { name: 'Kentucky Ave', color: 'red', value: 3 },
                { name: 'Indiana Ave', color: 'red', value: 3 },
                { name: 'Illinois Ave', color: 'red', value: 3 },
                { name: 'Atlantic Ave', color: 'yellow', value: 3 },
                { name: 'Ventnor Ave', color: 'yellow', value: 3 },
                { name: 'Marvin Gardens', color: 'yellow', value: 3 },
                { name: 'Pacific Ave', color: 'green', value: 4 },
                { name: 'N. Carolina Ave', color: 'green', value: 4 },
                { name: 'Pennsylvania Ave', color: 'green', value: 4 },
                { name: 'Park Place', color: 'blue', value: 4 },
                { name: 'Boardwalk', color: 'blue', value: 4 },
                { name: 'Reading RR', color: 'railroad', value: 2 },
                { name: 'Pennsylvania RR', color: 'railroad', value: 2 },
                { name: 'B&O Railroad', color: 'railroad', value: 2 },
                { name: 'Short Line', color: 'railroad', value: 2 },
                { name: 'Electric Co', color: 'utility', value: 2 },
                { name: 'Water Works', color: 'utility', value: 2 },
            ],
            money: [
                { value: 1, count: 6 }, { value: 2, count: 5 }, { value: 3, count: 3 },
                { value: 4, count: 3 }, { value: 5, count: 2 }, { value: 10, count: 1 },
            ],
            actions: [
                { name: 'Deal Breaker', desc: 'Steal a complete set!', value: 5, count: 2 },
                { name: 'Just Say No', desc: 'Block any action', value: 4, count: 3 },
                { name: 'Sly Deal', desc: 'Steal a property', value: 3, count: 3 },
                { name: 'Forced Deal', desc: 'Swap properties', value: 3, count: 4 },
                { name: 'Debt Collector', desc: 'Collect $5M', value: 3, count: 3 },
                { name: 'Birthday', desc: 'All pay $2M', value: 2, count: 3 },
                { name: 'Pass Go', desc: 'Draw 2 cards', value: 1, count: 10 },
                { name: 'House', desc: '+$3M rent', value: 3, count: 3 },
                { name: 'Hotel', desc: '+$4M rent', value: 4, count: 2 },
                { name: 'Double Rent', desc: '2x rent', value: 1, count: 2 },
            ],
            rent: [
                { colors: ['brown', 'lightBlue'], value: 1, count: 2 },
                { colors: ['pink', 'orange'], value: 1, count: 2 },
                { colors: ['red', 'yellow'], value: 1, count: 2 },
                { colors: ['green', 'blue'], value: 1, count: 2 },
                { colors: ['railroad', 'utility'], value: 1, count: 2 },
                { colors: ['wild'], value: 3, count: 3 },
            ],
            wilds: [
                { colors: ['brown', 'lightBlue'], count: 1 },
                { colors: ['pink', 'orange'], count: 2 },
                { colors: ['red', 'yellow'], count: 2 },
                { colors: ['green', 'blue'], count: 1 },
                { colors: ['green', 'railroad'], count: 1 },
                { colors: ['lightBlue', 'railroad'], count: 1 },
                { colors: ['railroad', 'utility'], count: 1 },
                { colors: ['wild'], count: 2 },
            ]
        };

        const COLOR_HEX = {
            brown: 0x8B4513, lightBlue: 0x87CEEB, pink: 0xFF1493, orange: 0xFF8C00,
            red: 0xDC143C, yellow: 0xFFD700, green: 0x228B22, blue: 0x0000CD,
            railroad: 0x333333, utility: 0x90EE90
        };

        const COLOR_NAMES = {
            brown: 'Brown', lightBlue: 'Light Blue', pink: 'Pink', orange: 'Orange',
            red: 'Red', yellow: 'Yellow', green: 'Green', blue: 'Dark Blue',
            railroad: 'Railroad', utility: 'Utility'
        };

        const SET_SIZE = {
            brown: 2, lightBlue: 3, pink: 3, orange: 3, red: 3,
            yellow: 3, green: 3, blue: 2, railroad: 4, utility: 2
        };

        // ==================== THREE.JS ====================
        let scene, camera, renderer, raycaster, mouse;
        let handCards = [], propertyMeshes = [], bankMeshes = [], opponentMeshes = [];
        let selectedCard = null, hoveredCard = null;

        let game = {
            players: [], currentPlayer: 0, deck: [], phase: 'draw', actions: 3, turnDrawn: false
        };

        const CARD_W = 0.22, CARD_H = 0.32, CARD_D = 0.003;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a15);
            scene.fog = new THREE.Fog(0x0a0a15, 8, 20);

            // Camera - looking down at table from player seat
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.2, 3.5);
            camera.lookAt(0, 0.8, 0);

            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createEnvironment();
            createLighting();

            window.addEventListener('resize', onResize);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onClick);

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('btn-draw').addEventListener('click', drawCards);
            document.getElementById('btn-play').addEventListener('click', playCard);
            document.getElementById('btn-bank').addEventListener('click', bankCard);
            document.getElementById('btn-end').addEventListener('click', endTurn);

            setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1000);
            animate();
        }

        function createEnvironment() {
            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(25, 25),
                new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.8 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Table
            const tableGeo = new THREE.CylinderGeometry(2.8, 2.8, 0.12, 64);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x0d5c0d, roughness: 0.85 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.y = 0.75;
            table.receiveShadow = true;
            scene.add(table);

            // Table rim
            const rim = new THREE.Mesh(
                new THREE.TorusGeometry(2.85, 0.1, 16, 64),
                new THREE.MeshStandardMaterial({ color: 0x3d1f0d, roughness: 0.4, metalness: 0.3 })
            );
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.81;
            rim.castShadow = true;
            scene.add(rim);

            // Gold inner rim
            const goldRim = new THREE.Mesh(
                new THREE.TorusGeometry(2.7, 0.02, 8, 64),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 })
            );
            goldRim.rotation.x = Math.PI / 2;
            goldRim.position.y = 0.82;
            scene.add(goldRim);

            // Table base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 1.0, 0.75, 32),
                new THREE.MeshStandardMaterial({ color: 0x3d1f0d, roughness: 0.5 })
            );
            base.position.y = 0.375;
            base.castShadow = true;
            scene.add(base);

            // Deck
            createDeckMesh();
        }

        function createLighting() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.25));

            const main = new THREE.SpotLight(0xfff5e0, 2.5);
            main.position.set(0, 6, 0);
            main.angle = Math.PI / 3.5;
            main.penumbra = 0.5;
            main.castShadow = true;
            main.shadow.mapSize.width = 2048;
            main.shadow.mapSize.height = 2048;
            scene.add(main);

            // Lamp shade
            const shade = new THREE.Mesh(
                new THREE.ConeGeometry(0.8, 0.5, 32, 1, true),
                new THREE.MeshStandardMaterial({ color: 0x1a5c1a, side: THREE.DoubleSide, emissive: 0x0a2a0a, emissiveIntensity: 0.3 })
            );
            shade.position.set(0, 5.2, 0);
            shade.rotation.x = Math.PI;
            scene.add(shade);

            // Accent lights
            const colors = [0xff6b6b, 0x6b6bff, 0xffd700];
            colors.forEach((c, i) => {
                const light = new THREE.PointLight(c, 0.3, 10);
                const a = (i / 3) * Math.PI * 2;
                light.position.set(Math.cos(a) * 5, 3, Math.sin(a) * 5);
                scene.add(light);
            });

            scene.add(new THREE.PointLight(0xffffff, 0.4, 8).position.set(0, 2, 4));
        }

        function createDeckMesh() {
            const deck = new THREE.Group();
            for (let i = 0; i < 25; i++) {
                const card = new THREE.Mesh(
                    new THREE.BoxGeometry(CARD_W, 0.002, CARD_H),
                    new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 })
                );
                card.position.y = i * 0.002;
                card.castShadow = true;
                deck.add(card);
            }
            // Top design
            const top = new THREE.Mesh(
                new THREE.PlaneGeometry(CARD_W * 0.7, CARD_H * 0.5),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, emissive: 0xffd700, emissiveIntensity: 0.2 })
            );
            top.position.y = 0.055;
            top.rotation.x = -Math.PI / 2;
            deck.add(top);

            deck.position.set(0, 0.82, 0);
            scene.add(deck);
        }

        // ==================== CARD TEXTURE ====================
        function createCardTexture(cardData) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, 256, 360);

            // Get color
            let color = '#888888';
            let headerText = '';
            let mainText = cardData.name || '';
            let valueText = `$${cardData.value}M`;

            if (cardData.type === 'property') {
                const hex = COLOR_HEX[cardData.color];
                color = '#' + hex.toString(16).padStart(6, '0');
                headerText = COLOR_NAMES[cardData.color] || cardData.color;
            } else if (cardData.type === 'money') {
                color = '#228B22';
                headerText = 'MONEY';
                mainText = `$${cardData.value}M`;
            } else if (cardData.type === 'action') {
                color = '#FFD700';
                headerText = 'ACTION';
            } else if (cardData.type === 'rent') {
                color = '#DC143C';
                headerText = 'RENT';
                mainText = cardData.colors[0] === 'wild' ? 'WILD RENT' : 'RENT CARD';
            } else if (cardData.type === 'wild') {
                color = '#9370DB';
                headerText = 'WILD';
                mainText = cardData.colors[0] === 'wild' ? 'ANY COLOR' : 'WILD PROPERTY';
            }

            // Header bar
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 256, 110);

            // Header text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(headerText, 128, 40);

            // Border
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, 250, 354);

            // Main text (card name)
            ctx.fillStyle = '#333';
            ctx.font = 'bold 20px Arial';
            const words = mainText.split(' ');
            let y = 160;
            let line = '';
            words.forEach(word => {
                const test = line + word + ' ';
                if (ctx.measureText(test).width > 220) {
                    ctx.fillText(line.trim(), 128, y);
                    line = word + ' ';
                    y += 26;
                } else {
                    line = test;
                }
            });
            ctx.fillText(line.trim(), 128, y);

            // Description for actions
            if (cardData.description) {
                ctx.font = '16px Arial';
                ctx.fillStyle = '#666';
                ctx.fillText(cardData.description, 128, y + 40);
            }

            // Value circle
            ctx.beginPath();
            ctx.arc(40, 320, 28, 0, Math.PI * 2);
            ctx.fillStyle = '#228B22';
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(valueText, 40, 326);

            // Card type icon in header
            if (cardData.type === 'money') {
                ctx.font = 'bold 48px Arial';
                ctx.fillText('$', 128, 90);
            } else if (cardData.type === 'action') {
                ctx.font = '36px Arial';
                ctx.fillText('⚡', 128, 90);
            } else if (cardData.type === 'rent') {
                ctx.font = '36px Arial';
                ctx.fillText('🏠', 128, 90);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 4;
            return texture;
        }

        function createCard3D(cardData, forTable = false) {
            const group = new THREE.Group();

            const texture = createCardTexture(cardData);

            // Front face with texture
            const frontGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
            const frontMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                metalness: 0.05
            });
            const front = new THREE.Mesh(frontGeo, frontMat);
            front.position.z = CARD_D / 2 + 0.001;
            group.add(front);

            // Back face (red)
            const backGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
            const backMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.4 });
            const back = new THREE.Mesh(backGeo, backMat);
            back.position.z = -CARD_D / 2 - 0.001;
            back.rotation.y = Math.PI;
            group.add(back);

            // Edge
            const edgeGeo = new THREE.BoxGeometry(CARD_W + 0.005, CARD_H + 0.005, CARD_D);
            const edgeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const edge = new THREE.Mesh(edgeGeo, edgeMat);
            group.add(edge);

            group.castShadow = true;
            group.userData = {
                cardData,
                isCard: true,
                originalPosition: new THREE.Vector3(),
                originalRotation: new THREE.Euler()
            };

            return group;
        }

        function createCardBack() {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D);
            const mat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 });
            group.add(new THREE.Mesh(geo, mat));
            return group;
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            // Clear old meshes
            propertyMeshes.forEach(m => scene.remove(m));
            bankMeshes.forEach(m => scene.remove(m));
            opponentMeshes.forEach(m => scene.remove(m));
            propertyMeshes = [];
            bankMeshes = [];
            opponentMeshes = [];

            const player = game.players[game.currentPlayer];

            // Player's properties (in front, organized by color)
            let propX = -0.8;
            for (const color in player.properties) {
                const cards = player.properties[color];
                cards.forEach((card, i) => {
                    const mesh = createCard3D(card, true);
                    mesh.position.set(propX, 0.83 + i * 0.003, 1.2 + i * 0.02);
                    mesh.rotation.x = -Math.PI / 2.5;
                    propertyMeshes.push(mesh);
                    scene.add(mesh);
                });
                propX += 0.3;
            }

            // Player's bank (right side)
            player.bank.forEach((card, i) => {
                const mesh = createCard3D(card, true);
                mesh.position.set(1.5 + (i % 4) * 0.08, 0.83 + Math.floor(i / 4) * 0.003, 1.0 + (i % 4) * 0.02);
                mesh.rotation.x = -Math.PI / 2.2;
                mesh.rotation.z = 0.1;
                bankMeshes.push(mesh);
                scene.add(mesh);
            });

            // Opponents (across the table)
            game.players.forEach((opp, idx) => {
                if (idx === game.currentPlayer) return;

                const angle = Math.PI + ((idx - game.currentPlayer) / game.players.length) * Math.PI * 0.6;
                const dist = 2.0;
                const ox = Math.sin(angle) * dist;
                const oz = Math.cos(angle) * dist;

                // Opponent's card backs (hand)
                for (let i = 0; i < Math.min(opp.hand.length, 7); i++) {
                    const card = createCardBack();
                    card.position.set(ox + (i - 3) * 0.1, 0.85, oz);
                    card.rotation.x = -Math.PI / 2;
                    card.rotation.z = Math.PI;
                    card.scale.set(0.6, 0.6, 0.6);
                    opponentMeshes.push(card);
                    scene.add(card);
                }

                // Opponent's properties
                let oppPropX = ox - 0.4;
                for (const color in opp.properties) {
                    opp.properties[color].forEach((card, i) => {
                        const mesh = createCard3D(card, true);
                        mesh.position.set(oppPropX, 0.83 + i * 0.002, oz + 0.4);
                        mesh.rotation.x = -Math.PI / 2;
                        mesh.scale.set(0.5, 0.5, 0.5);
                        opponentMeshes.push(mesh);
                        scene.add(mesh);
                    });
                    oppPropX += 0.2;
                }

                // Opponent's bank
                opp.bank.forEach((card, i) => {
                    const mesh = createCard3D(card, true);
                    mesh.position.set(ox + 0.6 + (i % 3) * 0.06, 0.83 + Math.floor(i / 3) * 0.002, oz + 0.3);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.scale.set(0.4, 0.4, 0.4);
                    opponentMeshes.push(mesh);
                    scene.add(mesh);
                });
            });
        }

        function createHandCards() {
            handCards.forEach(c => scene.remove(c));
            handCards = [];

            const player = game.players[game.currentPlayer];
            if (!player) return;

            const count = player.hand.length;
            const spread = Math.min(count * 0.13, 1.4);

            player.hand.forEach((cardData, i) => {
                const card = createCard3D(cardData);
                const t = count > 1 ? i / (count - 1) : 0.5;
                const x = (t - 0.5) * spread;
                const y = 1.3 + (0.25 - Math.pow(t - 0.5, 2)) * 0.3;
                const z = 2.8;

                card.position.set(x, y, z);
                card.rotation.x = -0.35;
                card.rotation.y = (t - 0.5) * -0.2;
                card.rotation.z = (t - 0.5) * 0.08;

                card.userData.originalPosition.copy(card.position);
                card.userData.originalRotation.copy(card.rotation);
                card.userData.index = i;

                handCards.push(card);
                scene.add(card);
            });
        }

        // ==================== GAME LOGIC ====================
        function createDeck() {
            const deck = [];
            let id = 0;

            CARD_DATA.properties.forEach(p => deck.push({ id: id++, type: 'property', ...p }));
            CARD_DATA.money.forEach(m => {
                for (let i = 0; i < m.count; i++) deck.push({ id: id++, type: 'money', name: `$${m.value}M`, value: m.value });
            });
            CARD_DATA.actions.forEach(a => {
                for (let i = 0; i < a.count; i++) deck.push({ id: id++, type: 'action', name: a.name, description: a.desc, value: a.value });
            });
            CARD_DATA.rent.forEach(r => {
                for (let i = 0; i < r.count; i++) deck.push({ id: id++, type: 'rent', name: 'Rent', colors: r.colors, value: r.value });
            });
            CARD_DATA.wilds.forEach(w => {
                for (let i = 0; i < w.count; i++) deck.push({ id: id++, type: 'wild', name: 'Wild', colors: w.colors, value: 0 });
            });

            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startGame() {
            const count = parseInt(document.getElementById('player-count').value);
            game.deck = createDeck();
            game.players = [];
            game.currentPlayer = 0;
            game.phase = 'draw';
            game.actions = 3;
            game.turnDrawn = false;

            for (let i = 0; i < count; i++) {
                const p = { name: `Player ${i + 1}`, hand: [], properties: {}, bank: [] };
                for (let j = 0; j < 5; j++) if (game.deck.length) p.hand.push(game.deck.pop());
                game.players.push(p);
            }

            document.getElementById('setup-screen').classList.add('hidden');
            createHandCards();
            renderTable();
            updateUI();
        }

        function drawCards() {
            if (game.turnDrawn) return;
            const p = game.players[game.currentPlayer];
            const n = p.hand.length === 0 ? 5 : 2;
            for (let i = 0; i < n; i++) if (game.deck.length) p.hand.push(game.deck.pop());
            game.turnDrawn = true;
            game.phase = 'play';
            createHandCards();
            updateUI();
        }

        function playCard() {
            if (!selectedCard || game.actions <= 0) return;
            const p = game.players[game.currentPlayer];
            const data = selectedCard.userData.cardData;
            const idx = p.hand.findIndex(c => c.id === data.id);
            if (idx === -1) return;

            if (data.type === 'property' || data.type === 'wild') {
                const color = data.color || (data.colors[0] === 'wild' ? 'brown' : data.colors[0]);
                if (!p.properties[color]) p.properties[color] = [];
                p.properties[color].push(data);
            } else if (data.type === 'action' && data.name === 'Pass Go') {
                for (let i = 0; i < 2; i++) if (game.deck.length) p.hand.push(game.deck.pop());
            }

            p.hand.splice(idx, 1);
            game.actions--;
            selectedCard = null;
            createHandCards();
            renderTable();
            updateUI();
            checkWin();
        }

        function bankCard() {
            if (!selectedCard || game.actions <= 0) return;
            const p = game.players[game.currentPlayer];
            const data = selectedCard.userData.cardData;
            const idx = p.hand.findIndex(c => c.id === data.id);
            if (idx === -1) return;

            p.bank.push(data);
            p.hand.splice(idx, 1);
            game.actions--;
            selectedCard = null;
            createHandCards();
            renderTable();
            updateUI();
        }

        function endTurn() {
            const p = game.players[game.currentPlayer];
            if (p.hand.length > 7) {
                document.getElementById('instructions').textContent = 'Too many cards! Click cards to discard down to 7';
                game.phase = 'discard';
                return;
            }
            game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
            game.actions = 3;
            game.phase = 'draw';
            game.turnDrawn = false;
            selectedCard = null;
            createHandCards();
            renderTable();
            updateUI();
        }

        function checkWin() {
            const p = game.players[game.currentPlayer];
            let sets = 0;
            for (const c in p.properties) {
                if (p.properties[c].length >= SET_SIZE[c]) sets++;
            }
            if (sets >= 3) {
                document.getElementById('winner-name').textContent = `${p.name} Wins!`;
                document.getElementById('winner-screen').classList.add('visible');
            }
        }

        function updateUI() {
            const p = game.players[game.currentPlayer];
            document.getElementById('player-name').textContent = p.name;
            document.getElementById('hud-actions').textContent = game.actions;
            document.getElementById('hud-cards').textContent = p.hand.length;

            let sets = 0;
            for (const c in p.properties) if (p.properties[c].length >= SET_SIZE[c]) sets++;
            document.getElementById('hud-sets').textContent = `${sets}/3`;

            const bank = p.bank.reduce((s, c) => s + (c.value || 0), 0);
            document.getElementById('hud-bank').textContent = `$${bank}M`;

            document.getElementById('btn-draw').disabled = game.turnDrawn;
            document.getElementById('btn-play').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-bank').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-end').disabled = !game.turnDrawn;

            if (!game.turnDrawn) {
                document.getElementById('instructions').textContent = 'Click DRAW CARDS to start your turn';
            } else if (game.actions > 0) {
                document.getElementById('instructions').textContent = selectedCard
                    ? 'Click PLAY (property) or BANK (money) • Click card again to deselect'
                    : `Select a card • ${game.actions} actions left`;
            } else {
                document.getElementById('instructions').textContent = 'No actions left • Click END TURN';
            }
        }

        // ==================== INTERACTION ====================
        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(handCards, true);

            if (hoveredCard && hoveredCard !== selectedCard) animateCard(hoveredCard, false, false);
            hoveredCard = null;

            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj.parent && !obj.userData.isCard) obj = obj.parent;
                if (obj.userData.isCard) {
                    hoveredCard = obj;
                    if (hoveredCard !== selectedCard) animateCard(hoveredCard, true, false);
                    showTooltip(obj.userData.cardData);
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }
            hideTooltip();
            document.body.style.cursor = 'default';
        }

        function onClick() {
            if (game.phase === 'discard' && hoveredCard) {
                const p = game.players[game.currentPlayer];
                const idx = p.hand.findIndex(c => c.id === hoveredCard.userData.cardData.id);
                if (idx !== -1) {
                    p.hand.splice(idx, 1);
                    if (p.hand.length <= 7) endTurn();
                    else { createHandCards(); updateUI(); }
                }
                return;
            }

            if (!hoveredCard) {
                if (selectedCard) { animateCard(selectedCard, false, false); selectedCard = null; updateUI(); }
                return;
            }

            if (selectedCard === hoveredCard) {
                animateCard(selectedCard, false, false);
                selectedCard = null;
            } else {
                if (selectedCard) animateCard(selectedCard, false, false);
                selectedCard = hoveredCard;
                animateCard(selectedCard, false, true);
            }
            updateUI();
        }

        function animateCard(card, hover, select) {
            const target = card.userData.originalPosition.clone();
            const rot = card.userData.originalRotation.clone();

            if (select) {
                target.y += 0.12;
                target.z += 0.15;
                rot.x = -0.15;
            } else if (hover) {
                target.y += 0.06;
                target.z += 0.08;
            }

            animateTo(card, target, rot, 150);
        }

        function animateTo(obj, pos, rot, dur) {
            const sp = obj.position.clone(), sr = obj.rotation.clone();
            const start = Date.now();
            function update() {
                const t = Math.min((Date.now() - start) / dur, 1);
                const e = 1 - Math.pow(1 - t, 3);
                obj.position.lerpVectors(sp, pos, e);
                obj.rotation.x = sr.x + (rot.x - sr.x) * e;
                obj.rotation.y = sr.y + (rot.y - sr.y) * e;
                obj.rotation.z = sr.z + (rot.z - sr.z) * e;
                if (t < 1) requestAnimationFrame(update);
            }
            update();
        }

        function showTooltip(data) {
            const t = document.getElementById('card-tooltip');
            document.getElementById('tooltip-title').textContent = data.name;
            let desc = '';
            if (data.type === 'property') desc = `${COLOR_NAMES[data.color]} Property`;
            else if (data.type === 'money') desc = 'Add to your bank';
            else if (data.type === 'action') desc = data.description || 'Action card';
            else if (data.type === 'rent') desc = 'Charge rent';
            else if (data.type === 'wild') desc = 'Wild - any color: ' + data.colors.join(', ');
            document.getElementById('tooltip-desc').textContent = desc;
            document.getElementById('tooltip-value').textContent = `Value: $${data.value}M`;
            t.classList.add('visible');
        }

        function hideTooltip() { document.getElementById('card-tooltip').classList.remove('visible'); }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = Date.now() * 0.0002;
            camera.position.x = Math.sin(t) * 0.03;
            renderer.render(scene, camera);
        }
    </script>
</body>
