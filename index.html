<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monopoly Deal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Setup Screen */
        #setup {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            z-index: 1000;
        }
        #setup.hidden { display: none; }
        .setup-box {
            background: rgba(255,255,255,0.1);
            padding: 40px 50px; border-radius: 20px;
            text-align: center; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.3);
        }
        .setup-box h1 { color: #ffd700; font-size: 32px; margin-bottom: 5px; }
        .setup-box p { color: #aaa; margin-bottom: 30px; }
        .setup-box select {
            width: 100%; padding: 12px; font-size: 16px;
            border-radius: 8px; border: none; margin-bottom: 20px;
            background: rgba(255,255,255,0.9); cursor: pointer;
        }
        .setup-box button {
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            border: none; color: #000; padding: 14px 40px;
            font-size: 16px; font-weight: bold; border-radius: 10px;
            cursor: pointer; transition: transform 0.2s;
        }
        .setup-box button:hover { transform: scale(1.05); }

        /* Game Layout */
        #game { display: none; height: 100vh; flex-direction: column; }
        #game.active { display: flex; }

        /* Top Bar - Opponents */
        #opponents {
            display: flex; justify-content: center; gap: 15px;
            padding: 15px; background: rgba(0,0,0,0.3);
        }
        .opponent {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 12px;
            color: white; text-align: center; min-width: 120px;
            border: 2px solid transparent; transition: all 0.3s;
        }
        .opponent.active { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .opponent-name { font-weight: bold; font-size: 14px; }
        .opponent-cards { font-size: 12px; opacity: 0.7; margin-top: 3px; }
        .opponent-sets { font-size: 11px; color: #4CAF50; margin-top: 3px; }

        /* Middle - Table Area */
        #table {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; gap: 20px; overflow-y: auto;
        }

        /* Status Display */
        #status {
            background: rgba(0,0,0,0.5); padding: 15px 30px;
            border-radius: 15px; color: white; text-align: center;
        }
        #status h2 { color: #ffd700; font-size: 18px; margin-bottom: 5px; }
        #status p { font-size: 14px; opacity: 0.8; }

        /* Your Table (Properties + Bank) */
        #your-table {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;
        }
        .table-section {
            background: rgba(255,255,255,0.05);
            padding: 15px; border-radius: 12px; min-width: 200px;
        }
        .table-section h3 {
            color: #ffd700; font-size: 13px; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .property-row {
            display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap;
        }
        .mini-card {
            width: 45px; height: 65px; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: white; font-weight: bold;
            text-align: center; padding: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .bank-total { color: #4CAF50; font-size: 18px; font-weight: bold; }

        /* Bottom - Your Hand */
        #hand-area {
            background: rgba(0,0,0,0.4);
            padding: 20px; padding-bottom: 30px;
        }
        #hand {
            display: flex; justify-content: center;
            gap: 8px; flex-wrap: nowrap; overflow-x: auto;
            padding: 10px 0;
        }

        /* Cards */
        .card {
            width: 90px; height: 130px; border-radius: 10px;
            background: white; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0; position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-15px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card.selected {
            transform: translateY(-25px);
            box-shadow: 0 15px 40px rgba(255,215,0,0.5);
            outline: 3px solid #ffd700;
        }
        .card-header {
            padding: 8px 5px; color: white; font-size: 10px;
            font-weight: bold; text-align: center;
            text-transform: uppercase;
        }
        .card-body {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 5px; text-align: center;
        }
        .card-name { font-size: 11px; font-weight: bold; color: #333; }
        .card-desc { font-size: 9px; color: #666; margin-top: 3px; }
        .card-value {
            position: absolute; bottom: 5px; left: 5px;
            background: #228B22; color: white;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold;
        }

        /* Action Buttons */
        #actions {
            display: flex; justify-content: center; gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            padding: 12px 25px; border-radius: 10px;
            font-size: 14px; font-weight: bold;
            cursor: pointer; border: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .action-btn:hover:not(:disabled) { transform: scale(1.05); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-draw { background: linear-gradient(180deg, #4CAF50, #2E7D32); color: white; }
        .btn-play { background: linear-gradient(180deg, #2196F3, #1565C0); color: white; }
        .btn-bank { background: linear-gradient(180deg, #FF9800, #E65100); color: white; }
        .btn-end { background: linear-gradient(180deg, #9C27B0, #6A1B9A); color: white; }

        /* Winner Screen */
        #winner {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
        }
        #winner.show { display: flex; }
        .winner-box { text-align: center; }
        .winner-box h1 { color: #ffd700; font-size: 48px; margin-bottom: 10px; }
        .winner-box p { color: white; font-size: 24px; margin-bottom: 30px; }
        .winner-box button {
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            border: none; color: #000; padding: 15px 40px;
            font-size: 16px; font-weight: bold; border-radius: 10px;
            cursor: pointer;
        }

        /* Modal for player selection */
        #modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 500;
        }
        #modal.show { display: flex; }
        .modal-box {
            background: #1a1a2e; border: 2px solid #ffd700;
            border-radius: 15px; padding: 25px; text-align: center;
            min-width: 280px;
        }
        .modal-box h3 { color: #ffd700; margin-bottom: 15px; }
        .modal-options { display: flex; flex-direction: column; gap: 10px; }
        .modal-opt {
            padding: 12px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; color: white; cursor: pointer;
            transition: all 0.2s;
        }
        .modal-opt:hover { background: rgba(255,215,0,0.2); border-color: #ffd700; }

        /* Responsive */
        @media (max-width: 600px) {
            .card { width: 70px; height: 100px; }
            .card-header { font-size: 8px; padding: 5px 3px; }
            .card-name { font-size: 9px; }
            .card-value { width: 20px; height: 20px; font-size: 8px; }
            .action-btn { padding: 10px 18px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="setup">
        <div class="setup-box">
            <h1>Monopoly Deal</h1>
            <p>The Card Game</p>
            <select id="player-count">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>
            <button onclick="startGame()">Play</button>
        </div>
    </div>

    <div id="game">
        <div id="opponents"></div>
        <div id="table">
            <div id="status">
                <h2 id="turn-text">Your Turn</h2>
                <p id="action-text">Draw 2 cards to start</p>
            </div>
            <div id="your-table">
                <div class="table-section" id="properties-section">
                    <h3>Your Properties</h3>
                    <div id="properties"></div>
                </div>
                <div class="table-section" id="bank-section">
                    <h3>Your Bank</h3>
                    <div id="bank"></div>
                    <div class="bank-total" id="bank-total">$0M</div>
                </div>
            </div>
        </div>
        <div id="hand-area">
            <div id="hand"></div>
            <div id="actions">
                <button class="action-btn btn-draw" id="btn-draw" onclick="drawCards()">Draw Cards</button>
                <button class="action-btn btn-play" id="btn-play" onclick="playSelected()" disabled>Play</button>
                <button class="action-btn btn-bank" id="btn-bank" onclick="bankSelected()" disabled>Bank</button>
                <button class="action-btn btn-end" id="btn-end" onclick="endTurn()" disabled>End Turn</button>
            </div>
        </div>
    </div>

    <div id="winner">
        <div class="winner-box">
            <h1>Winner!</h1>
            <p id="winner-name">Player 1</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 id="modal-title">Choose</h3>
            <div class="modal-options" id="modal-options"></div>
        </div>
    </div>

    <script>
        // Color definitions
        const COLORS = {
            brown: { hex: '#8B4513', name: 'Brown', size: 2 },
            lightBlue: { hex: '#87CEEB', name: 'Light Blue', size: 3 },
            pink: { hex: '#FF69B4', name: 'Pink', size: 3 },
            orange: { hex: '#FF8C00', name: 'Orange', size: 3 },
            red: { hex: '#DC143C', name: 'Red', size: 3 },
            yellow: { hex: '#FFD700', name: 'Yellow', size: 3 },
            green: { hex: '#228B22', name: 'Green', size: 3 },
            blue: { hex: '#0000CD', name: 'Dark Blue', size: 2 },
            railroad: { hex: '#333', name: 'Railroad', size: 4 },
            utility: { hex: '#90EE90', name: 'Utility', size: 2 }
        };

        // Card definitions
        const CARDS = {
            properties: [
                { name: 'Mediterranean', color: 'brown', value: 1 },
                { name: 'Baltic Ave', color: 'brown', value: 1 },
                { name: 'Oriental Ave', color: 'lightBlue', value: 1 },
                { name: 'Vermont Ave', color: 'lightBlue', value: 1 },
                { name: 'Connecticut', color: 'lightBlue', value: 1 },
                { name: 'St. Charles', color: 'pink', value: 2 },
                { name: 'States Ave', color: 'pink', value: 2 },
                { name: 'Virginia Ave', color: 'pink', value: 2 },
                { name: 'St. James', color: 'orange', value: 2 },
                { name: 'Tennessee', color: 'orange', value: 2 },
                { name: 'New York Ave', color: 'orange', value: 2 },
                { name: 'Kentucky Ave', color: 'red', value: 3 },
                { name: 'Indiana Ave', color: 'red', value: 3 },
                { name: 'Illinois Ave', color: 'red', value: 3 },
                { name: 'Atlantic Ave', color: 'yellow', value: 3 },
                { name: 'Ventnor Ave', color: 'yellow', value: 3 },
                { name: 'Marvin Gdns', color: 'yellow', value: 3 },
                { name: 'Pacific Ave', color: 'green', value: 4 },
                { name: 'N. Carolina', color: 'green', value: 4 },
                { name: 'Pennsylvania', color: 'green', value: 4 },
                { name: 'Park Place', color: 'blue', value: 4 },
                { name: 'Boardwalk', color: 'blue', value: 4 },
                { name: 'Reading RR', color: 'railroad', value: 2 },
                { name: 'Penn. RR', color: 'railroad', value: 2 },
                { name: 'B&O RR', color: 'railroad', value: 2 },
                { name: 'Short Line', color: 'railroad', value: 2 },
                { name: 'Electric Co', color: 'utility', value: 2 },
                { name: 'Water Works', color: 'utility', value: 2 },
            ],
            money: [
                { value: 1, count: 6 }, { value: 2, count: 5 }, { value: 3, count: 3 },
                { value: 4, count: 3 }, { value: 5, count: 2 }, { value: 10, count: 1 }
            ],
            actions: [
                { name: 'Deal Breaker', desc: 'Steal complete set', value: 5, count: 2, action: 'dealBreaker' },
                { name: 'Just Say No', desc: 'Block any action', value: 4, count: 3, action: 'justSayNo' },
                { name: 'Sly Deal', desc: 'Steal 1 property', value: 3, count: 3, action: 'slyDeal' },
                { name: 'Forced Deal', desc: 'Swap properties', value: 3, count: 3, action: 'forcedDeal' },
                { name: 'Debt Collector', desc: 'Collect $5M', value: 3, count: 3, action: 'debtCollector' },
                { name: 'Birthday', desc: 'All pay $2M', value: 2, count: 3, action: 'birthday' },
                { name: 'Pass Go', desc: 'Draw 2 cards', value: 1, count: 10, action: 'passGo' },
                { name: 'House', desc: '+$3M rent', value: 3, count: 3, action: 'house' },
                { name: 'Hotel', desc: '+$4M rent', value: 4, count: 2, action: 'hotel' },
                { name: 'Double Rent', desc: '2x rent', value: 1, count: 2, action: 'doubleRent' }
            ],
            rent: [
                { colors: ['brown', 'lightBlue'], value: 1, count: 2 },
                { colors: ['pink', 'orange'], value: 1, count: 2 },
                { colors: ['red', 'yellow'], value: 1, count: 2 },
                { colors: ['green', 'blue'], value: 1, count: 2 },
                { colors: ['railroad', 'utility'], value: 1, count: 2 },
                { colors: ['wild'], value: 3, count: 3 }
            ],
            wilds: [
                { colors: ['brown', 'lightBlue'], count: 1 },
                { colors: ['pink', 'orange'], count: 2 },
                { colors: ['red', 'yellow'], count: 2 },
                { colors: ['green', 'blue'], count: 1 },
                { colors: ['green', 'railroad'], count: 1 },
                { colors: ['utility', 'railroad'], count: 1 },
                { colors: ['wild'], count: 2 }
            ]
        };

        // Game state
        let game = {
            players: [],
            current: 0,
            deck: [],
            actions: 3,
            drawn: false,
            selectedCard: null
        };

        // Create deck
        function createDeck() {
            const deck = [];
            let id = 0;

            CARDS.properties.forEach(p => {
                deck.push({ id: id++, type: 'property', ...p });
            });

            CARDS.money.forEach(m => {
                for (let i = 0; i < m.count; i++) {
                    deck.push({ id: id++, type: 'money', name: `$${m.value}M`, value: m.value });
                }
            });

            CARDS.actions.forEach(a => {
                for (let i = 0; i < a.count; i++) {
                    deck.push({ id: id++, type: 'action', ...a });
                }
            });

            CARDS.rent.forEach(r => {
                for (let i = 0; i < r.count; i++) {
                    deck.push({ id: id++, type: 'rent', name: 'Rent', colors: r.colors, value: r.value });
                }
            });

            CARDS.wilds.forEach(w => {
                for (let i = 0; i < w.count; i++) {
                    deck.push({ id: id++, type: 'wild', name: 'Wild Card', colors: w.colors, value: 0 });
                }
            });

            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            return deck;
        }

        // Start game
        function startGame() {
            const count = parseInt(document.getElementById('player-count').value);
            game.deck = createDeck();
            game.players = [];
            game.current = 0;
            game.actions = 3;
            game.drawn = false;
            game.selectedCard = null;

            for (let i = 0; i < count; i++) {
                const p = { name: `Player ${i + 1}`, hand: [], properties: {}, bank: [] };
                for (let j = 0; j < 5; j++) {
                    if (game.deck.length) p.hand.push(game.deck.pop());
                }
                game.players.push(p);
            }

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game').classList.add('active');
            render();
        }

        // Draw cards
        function drawCards() {
            if (game.drawn) return;
            const p = game.players[game.current];
            const count = p.hand.length === 0 ? 5 : 2;
            for (let i = 0; i < count; i++) {
                if (game.deck.length) p.hand.push(game.deck.pop());
            }
            game.drawn = true;
            game.selectedCard = null;
            render();
        }

        // Select card
        function selectCard(index) {
            if (!game.drawn || game.actions <= 0) return;
            if (game.selectedCard === index) {
                game.selectedCard = null;
            } else {
                game.selectedCard = index;
            }
            render();
        }

        // Play selected card
        function playSelected() {
            if (game.selectedCard === null || game.actions <= 0) return;
            const p = game.players[game.current];
            const card = p.hand[game.selectedCard];

            if (card.type === 'property') {
                if (!p.properties[card.color]) p.properties[card.color] = [];
                p.properties[card.color].push(card);
                p.hand.splice(game.selectedCard, 1);
                game.actions--;
                game.selectedCard = null;
                afterPlay();
            } else if (card.type === 'wild') {
                const color = card.colors[0] === 'wild' ? 'brown' : card.colors[0];
                if (!p.properties[color]) p.properties[color] = [];
                p.properties[color].push(card);
                p.hand.splice(game.selectedCard, 1);
                game.actions--;
                game.selectedCard = null;
                afterPlay();
            } else if (card.type === 'action') {
                executeAction(card, game.selectedCard);
            } else if (card.type === 'rent') {
                executeRent(card, game.selectedCard);
            } else {
                // Money cards can't be played as action
                game.selectedCard = null;
                render();
            }
        }

        // Bank selected card
        function bankSelected() {
            if (game.selectedCard === null || game.actions <= 0) return;
            const p = game.players[game.current];
            const card = p.hand[game.selectedCard];
            p.bank.push(card);
            p.hand.splice(game.selectedCard, 1);
            game.actions--;
            game.selectedCard = null;
            afterPlay();
        }

        // Execute action card
        function executeAction(card, idx) {
            const p = game.players[game.current];

            switch (card.action) {
                case 'passGo':
                    for (let i = 0; i < 2; i++) {
                        if (game.deck.length) p.hand.push(game.deck.pop());
                    }
                    p.hand.splice(idx, 1);
                    game.actions--;
                    game.selectedCard = null;
                    afterPlay();
                    break;

                case 'birthday':
                    game.players.forEach((opp, i) => {
                        if (i !== game.current) collectFrom(opp, 2);
                    });
                    p.hand.splice(idx, 1);
                    game.actions--;
                    game.selectedCard = null;
                    afterPlay();
                    break;

                case 'debtCollector':
                    showPlayerPicker('Collect $5M from:', (oppIdx) => {
                        collectFrom(game.players[oppIdx], 5);
                        p.hand.splice(idx, 1);
                        game.actions--;
                        game.selectedCard = null;
                        afterPlay();
                    });
                    break;

                case 'slyDeal':
                    showPlayerPicker('Steal property from:', (oppIdx) => {
                        const opp = game.players[oppIdx];
                        const colors = Object.keys(opp.properties).filter(c =>
                            opp.properties[c].length > 0 && opp.properties[c].length < COLORS[c].size
                        );
                        if (colors.length > 0) {
                            const color = colors[0];
                            const stolen = opp.properties[color].pop();
                            if (!p.properties[color]) p.properties[color] = [];
                            p.properties[color].push(stolen);
                            if (opp.properties[color].length === 0) delete opp.properties[color];
                        }
                        p.hand.splice(idx, 1);
                        game.actions--;
                        game.selectedCard = null;
                        afterPlay();
                    });
                    break;

                case 'dealBreaker':
                    showPlayerPicker('Steal complete set from:', (oppIdx) => {
                        const opp = game.players[oppIdx];
                        const complete = Object.keys(opp.properties).find(c =>
                            opp.properties[c].length >= COLORS[c].size
                        );
                        if (complete) {
                            p.properties[complete] = opp.properties[complete];
                            delete opp.properties[complete];
                        }
                        p.hand.splice(idx, 1);
                        game.actions--;
                        game.selectedCard = null;
                        afterPlay();
                    });
                    break;

                default:
                    p.hand.splice(idx, 1);
                    game.actions--;
                    game.selectedCard = null;
                    afterPlay();
            }
        }

        // Execute rent card
        function executeRent(card, idx) {
            const p = game.players[game.current];
            const rentColor = card.colors[0] === 'wild' ? Object.keys(p.properties)[0] : card.colors[0];

            if (rentColor && p.properties[rentColor]) {
                const amount = p.properties[rentColor].length;
                game.players.forEach((opp, i) => {
                    if (i !== game.current) collectFrom(opp, amount);
                });
            }

            p.hand.splice(idx, 1);
            game.actions--;
            game.selectedCard = null;
            afterPlay();
        }

        // Collect money/property from player
        function collectFrom(player, amount) {
            let remaining = amount;
            const p = game.players[game.current];

            while (remaining > 0 && player.bank.length > 0) {
                const card = player.bank.pop();
                p.bank.push(card);
                remaining -= card.value;
            }

            if (remaining > 0) {
                for (const color in player.properties) {
                    while (remaining > 0 && player.properties[color].length > 0) {
                        const card = player.properties[color].pop();
                        if (!p.properties[color]) p.properties[color] = [];
                        p.properties[color].push(card);
                        remaining -= card.value;
                    }
                    if (player.properties[color].length === 0) delete player.properties[color];
                }
            }
        }

        // Show player picker modal
        function showPlayerPicker(title, callback) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').textContent = title;
            const opts = document.getElementById('modal-options');
            opts.innerHTML = '';

            game.players.forEach((p, i) => {
                if (i !== game.current) {
                    const btn = document.createElement('div');
                    btn.className = 'modal-opt';
                    btn.textContent = p.name;
                    btn.onclick = () => {
                        modal.classList.remove('show');
                        callback(i);
                    };
                    opts.appendChild(btn);
                }
            });

            const cancel = document.createElement('div');
            cancel.className = 'modal-opt';
            cancel.textContent = 'Cancel';
            cancel.onclick = () => modal.classList.remove('show');
            opts.appendChild(cancel);

            modal.classList.add('show');
        }

        // After playing a card
        function afterPlay() {
            checkWin();
            render();
        }

        // End turn
        function endTurn() {
            const p = game.players[game.current];
            if (p.hand.length > 7) {
                alert('You must have 7 or fewer cards. Bank some cards!');
                return;
            }

            game.current = (game.current + 1) % game.players.length;
            game.actions = 3;
            game.drawn = false;
            game.selectedCard = null;
            render();
        }

        // Check for winner
        function checkWin() {
            const p = game.players[game.current];
            let sets = 0;
            for (const c in p.properties) {
                if (p.properties[c].length >= COLORS[c].size) sets++;
            }
            if (sets >= 3) {
                document.getElementById('winner-name').textContent = p.name;
                document.getElementById('winner').classList.add('show');
            }
        }

        // Count complete sets
        function countSets(player) {
            let sets = 0;
            for (const c in player.properties) {
                if (player.properties[c].length >= COLORS[c].size) sets++;
            }
            return sets;
        }

        // Render everything
        function render() {
            const p = game.players[game.current];

            // Update status
            document.getElementById('turn-text').textContent =
                game.current === 0 ? 'Your Turn' : `${p.name}'s Turn`;

            let statusText = '';
            if (!game.drawn) {
                statusText = 'Draw cards to start';
            } else if (game.actions > 0) {
                statusText = `${game.actions} action${game.actions > 1 ? 's' : ''} remaining`;
            } else {
                statusText = 'End your turn';
            }
            document.getElementById('action-text').textContent = statusText;

            // Update opponents
            const oppsDiv = document.getElementById('opponents');
            oppsDiv.innerHTML = '';
            game.players.forEach((opp, i) => {
                const div = document.createElement('div');
                div.className = 'opponent' + (i === game.current ? ' active' : '');
                div.innerHTML = `
                    <div class="opponent-name">${opp.name}</div>
                    <div class="opponent-cards">${opp.hand.length} cards</div>
                    <div class="opponent-sets">${countSets(opp)}/3 sets</div>
                `;
                oppsDiv.appendChild(div);
            });

            // Update properties
            const propsDiv = document.getElementById('properties');
            propsDiv.innerHTML = '';
            for (const color in p.properties) {
                const row = document.createElement('div');
                row.className = 'property-row';
                p.properties[color].forEach(card => {
                    const mini = document.createElement('div');
                    mini.className = 'mini-card';
                    mini.style.background = COLORS[color].hex;
                    mini.textContent = card.name.substring(0, 8);
                    row.appendChild(mini);
                });
                const complete = p.properties[color].length >= COLORS[color].size;
                if (complete) {
                    const badge = document.createElement('div');
                    badge.className = 'mini-card';
                    badge.style.background = '#4CAF50';
                    badge.textContent = '✓';
                    row.appendChild(badge);
                }
                propsDiv.appendChild(row);
            }

            // Update bank
            const bankDiv = document.getElementById('bank');
            bankDiv.innerHTML = '';
            p.bank.forEach(card => {
                const mini = document.createElement('div');
                mini.className = 'mini-card';
                mini.style.background = '#228B22';
                mini.textContent = `$${card.value}M`;
                bankDiv.appendChild(mini);
            });
            const bankTotal = p.bank.reduce((sum, c) => sum + c.value, 0);
            document.getElementById('bank-total').textContent = `$${bankTotal}M`;

            // Update hand
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            p.hand.forEach((card, i) => {
                const cardEl = createCardElement(card, i);
                if (game.selectedCard === i) cardEl.classList.add('selected');
                cardEl.onclick = () => selectCard(i);
                handDiv.appendChild(cardEl);
            });

            // Update buttons
            document.getElementById('btn-draw').disabled = game.drawn;
            document.getElementById('btn-play').disabled = game.selectedCard === null || game.actions <= 0;
            document.getElementById('btn-bank').disabled = game.selectedCard === null || game.actions <= 0;
            document.getElementById('btn-end').disabled = !game.drawn;
        }

        // Create card element
        function createCardElement(card, index) {
            const div = document.createElement('div');
            div.className = 'card';

            let headerColor = '#666';
            let headerText = '';

            if (card.type === 'property') {
                headerColor = COLORS[card.color].hex;
                headerText = COLORS[card.color].name;
            } else if (card.type === 'money') {
                headerColor = '#228B22';
                headerText = 'Money';
            } else if (card.type === 'action') {
                headerColor = '#DAA520';
                headerText = 'Action';
            } else if (card.type === 'rent') {
                headerColor = '#DC143C';
                headerText = 'Rent';
            } else if (card.type === 'wild') {
                headerColor = '#8A2BE2';
                headerText = 'Wild';
            }

            div.innerHTML = `
                <div class="card-header" style="background: ${headerColor}">${headerText}</div>
                <div class="card-body">
                    <div class="card-name">${card.name}</div>
                    ${card.desc ? `<div class="card-desc">${card.desc}</div>` : ''}
                </div>
                <div class="card-value">$${card.value}</div>
            `;

            return div;
        }
    </script>
</body>
</html>
