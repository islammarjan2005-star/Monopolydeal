<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Deal - 3D Immersive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        #game-canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #game-canvas:active { cursor: grabbing; }

        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        #ui-overlay > * { pointer-events: auto; }

        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            padding: 12px 30px; border-radius: 15px; color: white;
            display: flex; gap: 35px; border: 1px solid rgba(255, 215, 0, 0.5);
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .hud-value { font-size: 22px; font-weight: bold; color: #ffd700; }
        .hud-label { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

        #player-tabs {
            position: absolute; top: 15px; left: 15px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .player-tab {
            background: rgba(0, 0, 0, 0.85); border: 2px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 10px 18px; border-radius: 10px; cursor: pointer;
            font-size: 13px; font-weight: 600; transition: all 0.3s;
        }
        .player-tab:hover { border-color: rgba(255, 215, 0, 0.5); }
        .player-tab.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.2); }
        .player-tab.current-turn { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }

        #action-buttons {
            position: absolute; bottom: 140px; right: 15px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .action-btn {
            background: linear-gradient(180deg, rgba(30,30,30,0.95) 0%, rgba(15,15,15,0.98) 100%);
            border: 2px solid rgba(255, 215, 0, 0.5); color: white;
            padding: 12px 22px; border-radius: 10px; cursor: pointer;
            font-size: 12px; font-weight: 600; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .action-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, rgba(255,215,0,0.2) 0%, rgba(255,215,0,0.1) 100%);
            border-color: #ffd700; transform: translateX(-3px);
        }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #card-tooltip {
            position: absolute; top: 80px; right: 15px;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px);
            padding: 15px 20px; border-radius: 12px; color: white;
            min-width: 220px; border: 1px solid rgba(255, 215, 0, 0.4);
            display: none;
        }
        #card-tooltip.visible { display: block; }
        #card-tooltip h3 { color: #ffd700; margin-bottom: 6px; font-size: 15px; }
        #card-tooltip p { font-size: 12px; opacity: 0.85; line-height: 1.4; }
        #card-tooltip .value { margin-top: 8px; color: #4CAF50; font-weight: bold; }

        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 10px 25px; border-radius: 10px;
            color: white; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #camera-hint {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 11px;
        }

        #action-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center;
            justify-content: center; z-index: 200;
        }
        #action-modal.visible { display: flex; }
        .modal-box {
            background: rgba(20,20,30,0.98); border: 2px solid #ffd700;
            border-radius: 20px; padding: 30px; max-width: 400px; text-align: center;
        }
        .modal-box h2 { color: #ffd700; margin-bottom: 15px; }
        .modal-box p { color: #ccc; margin-bottom: 20px; font-size: 14px; }
        .modal-options { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .modal-option {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            color: white; padding: 12px 20px; border-radius: 10px; cursor: pointer;
            transition: all 0.3s;
        }
        .modal-option:hover { border-color: #ffd700; background: rgba(255,215,0,0.2); }

        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a2040 100%);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #setup-screen.hidden { display: none; }
        .setup-box {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(30px);
            padding: 45px; border-radius: 25px; border: 2px solid rgba(255, 215, 0, 0.5);
            text-align: center; max-width: 420px;
        }
        .setup-box h1 { color: #ffd700; font-size: 38px; margin-bottom: 5px; }
        .setup-box h2 { color: white; font-size: 14px; font-weight: normal; margin-bottom: 35px; opacity: 0.7; letter-spacing: 3px; }
        .setup-box label { color: white; font-size: 13px; display: block; margin-bottom: 10px; text-align: left; }
        .setup-box select {
            width: 100%; padding: 14px; font-size: 14px; border-radius: 10px;
            border: 2px solid rgba(255, 215, 0, 0.4); background: rgba(0, 0, 0, 0.6);
            color: white; margin-bottom: 25px; cursor: pointer;
        }
        #start-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border: none; color: #000; padding: 16px 45px; font-size: 15px;
            font-weight: bold; border-radius: 12px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }

        #winner-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: none;
            align-items: center; justify-content: center; z-index: 2000;
        }
        #winner-screen.visible { display: flex; }
        .winner-box h1 { font-size: 56px; color: #ffd700; margin-bottom: 15px; }
        .winner-box p { font-size: 24px; color: white; margin-bottom: 35px; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 3000;
        }
        #loading.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .loader { width: 50px; height: 50px; border: 3px solid rgba(255, 215, 0, 0.2); border-top-color: #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; margin-top: 15px; font-size: 14px; }

        /* Zone labels */
        .zone-label {
            position: absolute; color: rgba(255,255,255,0.6); font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading"><div class="loader"></div><p>Loading...</p></div>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>MONOPOLY DEAL</h1>
            <h2>3D FIRST PERSON</h2>
            <label>Number of Players</label>
            <select id="player-count">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>
            <button id="start-btn">Enter Game</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="ui-overlay">
        <div id="player-tabs"></div>

        <div id="hud">
            <div class="hud-stat"><span class="hud-value" id="hud-turn">P1</span><span class="hud-label">Turn</span></div>
            <div class="hud-stat"><span class="hud-value" id="hud-actions">3</span><span class="hud-label">Actions</span></div>
            <div class="hud-stat"><span class="hud-value" id="hud-cards">5</span><span class="hud-label">Hand</span></div>
            <div class="hud-stat"><span class="hud-value" id="hud-sets">0/3</span><span class="hud-label">Sets</span></div>
            <div class="hud-stat"><span class="hud-value" id="hud-bank">$0</span><span class="hud-label">Bank</span></div>
        </div>

        <div id="card-tooltip">
            <h3 id="tooltip-title">Card</h3>
            <p id="tooltip-desc">Description</p>
            <div class="value" id="tooltip-value">$0M</div>
        </div>

        <div id="action-buttons">
            <button class="action-btn" id="btn-draw">Draw Cards</button>
            <button class="action-btn" id="btn-play">Play Card</button>
            <button class="action-btn" id="btn-bank">Bank Card</button>
            <button class="action-btn" id="btn-end">End Turn</button>
        </div>

        <div id="camera-hint">🖱️ Drag to rotate • Scroll to zoom</div>
        <div id="instructions">Click DRAW CARDS to start</div>
    </div>

    <div id="action-modal">
        <div class="modal-box">
            <h2 id="modal-title">Choose Target</h2>
            <p id="modal-desc">Select a player</p>
            <div class="modal-options" id="modal-options"></div>
        </div>
    </div>

    <div id="winner-screen">
        <div class="winner-box" style="text-align:center">
            <h1>🏆 WINNER! 🏆</h1>
            <p id="winner-name">Player 1</p>
            <button class="action-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // ==================== DATA ====================
        const COLORS = {
            brown: { hex: 0x8B4513, name: 'Brown', size: 2 },
            lightBlue: { hex: 0x87CEEB, name: 'Light Blue', size: 3 },
            pink: { hex: 0xFF1493, name: 'Pink', size: 3 },
            orange: { hex: 0xFF8C00, name: 'Orange', size: 3 },
            red: { hex: 0xDC143C, name: 'Red', size: 3 },
            yellow: { hex: 0xFFD700, name: 'Yellow', size: 3 },
            green: { hex: 0x228B22, name: 'Green', size: 3 },
            blue: { hex: 0x0000CD, name: 'Dark Blue', size: 2 },
            railroad: { hex: 0x333333, name: 'Railroad', size: 4 },
            utility: { hex: 0x90EE90, name: 'Utility', size: 2 }
        };

        const CARDS = {
            properties: [
                { name: 'Mediterranean', color: 'brown', value: 1 },
                { name: 'Baltic Ave', color: 'brown', value: 1 },
                { name: 'Oriental Ave', color: 'lightBlue', value: 1 },
                { name: 'Vermont Ave', color: 'lightBlue', value: 1 },
                { name: 'Connecticut', color: 'lightBlue', value: 1 },
                { name: 'St. Charles', color: 'pink', value: 2 },
                { name: 'States Ave', color: 'pink', value: 2 },
                { name: 'Virginia Ave', color: 'pink', value: 2 },
                { name: 'St. James Pl', color: 'orange', value: 2 },
                { name: 'Tennessee', color: 'orange', value: 2 },
                { name: 'New York Ave', color: 'orange', value: 2 },
                { name: 'Kentucky Ave', color: 'red', value: 3 },
                { name: 'Indiana Ave', color: 'red', value: 3 },
                { name: 'Illinois Ave', color: 'red', value: 3 },
                { name: 'Atlantic Ave', color: 'yellow', value: 3 },
                { name: 'Ventnor Ave', color: 'yellow', value: 3 },
                { name: 'Marvin Gdns', color: 'yellow', value: 3 },
                { name: 'Pacific Ave', color: 'green', value: 4 },
                { name: 'N. Carolina', color: 'green', value: 4 },
                { name: 'Pennsylvania', color: 'green', value: 4 },
                { name: 'Park Place', color: 'blue', value: 4 },
                { name: 'Boardwalk', color: 'blue', value: 4 },
                { name: 'Reading RR', color: 'railroad', value: 2 },
                { name: 'Penn. RR', color: 'railroad', value: 2 },
                { name: 'B&O RR', color: 'railroad', value: 2 },
                { name: 'Short Line', color: 'railroad', value: 2 },
                { name: 'Electric Co', color: 'utility', value: 2 },
                { name: 'Water Works', color: 'utility', value: 2 },
            ],
            money: [
                { value: 1, count: 6 }, { value: 2, count: 5 }, { value: 3, count: 3 },
                { value: 4, count: 3 }, { value: 5, count: 2 }, { value: 10, count: 1 }
            ],
            actions: [
                { name: 'Deal Breaker', desc: 'Steal a complete set', value: 5, count: 2, action: 'dealBreaker' },
                { name: 'Just Say No', desc: 'Block any action', value: 4, count: 3, action: 'justSayNo' },
                { name: 'Sly Deal', desc: 'Steal 1 property', value: 3, count: 3, action: 'slyDeal' },
                { name: 'Forced Deal', desc: 'Swap properties', value: 3, count: 3, action: 'forcedDeal' },
                { name: 'Debt Collect', desc: 'Collect $5M', value: 3, count: 3, action: 'debtCollector' },
                { name: 'Birthday!', desc: 'All pay $2M', value: 2, count: 3, action: 'birthday' },
                { name: 'Pass Go', desc: 'Draw 2 cards', value: 1, count: 10, action: 'passGo' },
                { name: 'House', desc: '+$3M rent', value: 3, count: 3, action: 'house' },
                { name: 'Hotel', desc: '+$4M rent', value: 4, count: 2, action: 'hotel' },
                { name: 'Double Rent', desc: '2x rent', value: 1, count: 2, action: 'doubleRent' }
            ],
            rent: [
                { colors: ['brown', 'lightBlue'], value: 1, count: 2 },
                { colors: ['pink', 'orange'], value: 1, count: 2 },
                { colors: ['red', 'yellow'], value: 1, count: 2 },
                { colors: ['green', 'blue'], value: 1, count: 2 },
                { colors: ['railroad', 'utility'], value: 1, count: 2 },
                { colors: ['wild'], value: 3, count: 3 }
            ],
            wilds: [
                { colors: ['brown', 'lightBlue'], count: 1 },
                { colors: ['pink', 'orange'], count: 2 },
                { colors: ['red', 'yellow'], count: 2 },
                { colors: ['green', 'blue'], count: 1 },
                { colors: ['green', 'railroad'], count: 1 },
                { colors: ['utility', 'railroad'], count: 1 },
                { colors: ['wild'], count: 2 }
            ]
        };

        // ==================== THREE.JS ====================
        let scene, camera, renderer, raycaster, mouse;
        let cameraAngle = 0, cameraDistance = 5, cameraHeight = 3;
        let isDragging = false, lastMouseX = 0, lastMouseY = 0;
        let handCards = [], tableMeshes = [];
        let selectedCard = null, hoveredCard = null;
        let viewingPlayer = 0;

        let game = { players: [], currentPlayer: 0, deck: [], phase: 'draw', actions: 3, turnDrawn: false };

        const CARD_W = 0.35, CARD_H = 0.5, CARD_D = 0.004;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.Fog(0x0a0a12, 10, 25);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCamera();

            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createEnvironment();
            createLighting();

            // Camera controls
            canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
            canvas.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mouseleave', () => isDragging = false);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('wheel', e => {
                cameraDistance = Math.max(3, Math.min(10, cameraDistance + e.deltaY * 0.005));
                updateCamera();
            });
            canvas.addEventListener('click', onClick);

            window.addEventListener('resize', onResize);
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('btn-draw').addEventListener('click', drawCards);
            document.getElementById('btn-play').addEventListener('click', playCard);
            document.getElementById('btn-bank').addEventListener('click', bankCard);
            document.getElementById('btn-end').addEventListener('click', endTurn);

            setTimeout(() => document.getElementById('loading').classList.add('hidden'), 800);
            animate();
        }

        function updateCamera() {
            camera.position.x = Math.sin(cameraAngle) * cameraDistance;
            camera.position.z = Math.cos(cameraAngle) * cameraDistance;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 0.5, 0);
        }

        function createEnvironment() {
            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Table
            const table = new THREE.Mesh(
                new THREE.CylinderGeometry(3.5, 3.5, 0.15, 64),
                new THREE.MeshStandardMaterial({ color: 0x0d5c0d, roughness: 0.8 })
            );
            table.position.y = 0.7;
            table.receiveShadow = true;
            scene.add(table);

            // Table rim
            const rim = new THREE.Mesh(
                new THREE.TorusGeometry(3.55, 0.12, 16, 64),
                new THREE.MeshStandardMaterial({ color: 0x4a2a10, roughness: 0.4, metalness: 0.2 })
            );
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.78;
            scene.add(rim);

            // Center deck
            createDeckMesh();
        }

        function createLighting() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.35));

            const main = new THREE.SpotLight(0xfff8e0, 2);
            main.position.set(0, 8, 0);
            main.angle = Math.PI / 3;
            main.penumbra = 0.4;
            main.castShadow = true;
            main.shadow.mapSize.width = 2048;
            main.shadow.mapSize.height = 2048;
            scene.add(main);

            // Lamp
            const shade = new THREE.Mesh(
                new THREE.ConeGeometry(1, 0.6, 32, 1, true),
                new THREE.MeshStandardMaterial({ color: 0x1a6b1a, side: THREE.DoubleSide })
            );
            shade.position.set(0, 6.5, 0);
            shade.rotation.x = Math.PI;
            scene.add(shade);
        }

        function createDeckMesh() {
            const deck = new THREE.Group();
            for (let i = 0; i < 30; i++) {
                const card = new THREE.Mesh(
                    new THREE.BoxGeometry(CARD_W, 0.003, CARD_H),
                    new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 })
                );
                card.position.y = i * 0.003;
                card.castShadow = true;
                deck.add(card);
            }
            deck.position.set(0, 0.78, 0);
            scene.add(deck);
        }

        // ==================== CARD TEXTURE ====================
        function createCardTexture(data) {
            const canvas = document.createElement('canvas');
            canvas.width = 280; canvas.height = 400;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, 280, 400);

            let color = '#666', header = '', main = data.name || '';

            if (data.type === 'property') {
                color = '#' + COLORS[data.color].hex.toString(16).padStart(6, '0');
                header = COLORS[data.color].name;
            } else if (data.type === 'money') {
                color = '#228B22'; header = 'MONEY'; main = `$${data.value}M`;
            } else if (data.type === 'action') {
                color = '#DAA520'; header = 'ACTION';
            } else if (data.type === 'rent') {
                color = '#DC143C'; header = 'RENT';
            } else if (data.type === 'wild') {
                color = '#8A2BE2'; header = 'WILD';
            }

            // Header
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 280, 100);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(header, 140, 45);

            // Border
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, 274, 394);

            // Main text
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            let y = 160;
            const words = main.split(' ');
            let line = '';
            words.forEach(w => {
                if (ctx.measureText(line + w).width > 250) {
                    ctx.fillText(line.trim(), 140, y);
                    line = w + ' '; y += 30;
                } else line += w + ' ';
            });
            ctx.fillText(line.trim(), 140, y);

            // Description
            if (data.description) {
                ctx.font = '18px Arial';
                ctx.fillStyle = '#666';
                ctx.fillText(data.description, 140, y + 45);
            }

            // Value
            ctx.beginPath();
            ctx.arc(50, 350, 32, 0, Math.PI * 2);
            ctx.fillStyle = '#228B22';
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.fillText(`$${data.value}M`, 50, 357);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function createCard3D(data) {
            const group = new THREE.Group();
            const tex = createCardTexture(data);

            const front = new THREE.Mesh(
                new THREE.PlaneGeometry(CARD_W, CARD_H),
                new THREE.MeshStandardMaterial({ map: tex, roughness: 0.25 })
            );
            front.position.z = CARD_D / 2 + 0.001;
            group.add(front);

            const back = new THREE.Mesh(
                new THREE.PlaneGeometry(CARD_W, CARD_H),
                new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 })
            );
            back.position.z = -CARD_D / 2 - 0.001;
            back.rotation.y = Math.PI;
            group.add(back);

            const edge = new THREE.Mesh(
                new THREE.BoxGeometry(CARD_W + 0.01, CARD_H + 0.01, CARD_D),
                new THREE.MeshStandardMaterial({ color: 0x111 })
            );
            group.add(edge);

            group.castShadow = true;
            group.userData = { cardData: data, isCard: true, orig: { pos: new THREE.Vector3(), rot: new THREE.Euler() } };
            return group;
        }

        function createCardBack() {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D),
                new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 })
            );
            group.add(mesh);
            group.castShadow = true;
            return group;
        }

        // ==================== RENDER ====================
        function renderTable() {
            tableMeshes.forEach(m => scene.remove(m));
            tableMeshes = [];

            game.players.forEach((player, pIdx) => {
                const angle = (pIdx / game.players.length) * Math.PI * 2 - Math.PI / 2;
                const dist = 2.2;
                const px = Math.sin(angle) * dist;
                const pz = Math.cos(angle) * dist;

                // Player zone marker
                const zone = new THREE.Mesh(
                    new THREE.RingGeometry(0.6, 0.65, 32),
                    new THREE.MeshBasicMaterial({ color: pIdx === game.currentPlayer ? 0xffd700 : 0x444444, side: THREE.DoubleSide })
                );
                zone.rotation.x = -Math.PI / 2;
                zone.position.set(px, 0.79, pz);
                tableMeshes.push(zone);
                scene.add(zone);

                // Properties - fan out from player position
                let propOffset = -0.5;
                for (const color in player.properties) {
                    player.properties[color].forEach((card, i) => {
                        const mesh = createCard3D(card);
                        mesh.position.set(
                            px + Math.cos(angle + 0.3) * (0.5 + propOffset),
                            0.8 + i * 0.005,
                            pz + Math.sin(angle + 0.3) * (0.5 + propOffset)
                        );
                        mesh.rotation.x = -Math.PI / 2;
                        mesh.rotation.z = angle + Math.PI;
                        mesh.scale.set(0.8, 0.8, 0.8);
                        tableMeshes.push(mesh);
                        scene.add(mesh);
                    });
                    propOffset += 0.4;
                }

                // Bank - stack to the side
                player.bank.forEach((card, i) => {
                    const mesh = createCard3D(card);
                    mesh.position.set(
                        px + Math.cos(angle - 0.4) * 0.7 + (i % 3) * 0.12,
                        0.8 + Math.floor(i / 3) * 0.005,
                        pz + Math.sin(angle - 0.4) * 0.7
                    );
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.rotation.z = angle + Math.PI + 0.1;
                    mesh.scale.set(0.6, 0.6, 0.6);
                    tableMeshes.push(mesh);
                    scene.add(mesh);
                });

                // Hand cards (face down for other players)
                if (pIdx !== game.currentPlayer) {
                    for (let i = 0; i < Math.min(player.hand.length, 7); i++) {
                        const card = createCardBack();
                        card.position.set(
                            px + Math.cos(angle) * 0.2 + (i - player.hand.length / 2) * 0.15,
                            0.85,
                            pz + Math.sin(angle) * 0.2
                        );
                        card.rotation.x = -Math.PI / 2;
                        card.scale.set(0.5, 0.5, 0.5);
                        tableMeshes.push(card);
                        scene.add(card);
                    }
                }
            });
        }

        function createHandCards() {
            handCards.forEach(c => scene.remove(c));
            handCards = [];

            const player = game.players[game.currentPlayer];
            if (!player) return;

            const count = player.hand.length;
            const spread = Math.min(count * 0.18, 1.8);

            player.hand.forEach((data, i) => {
                const card = createCard3D(data);
                const t = count > 1 ? i / (count - 1) : 0.5;

                // Position relative to camera
                const angle = cameraAngle;
                const handDist = 1.8;
                const x = Math.sin(angle) * handDist + (t - 0.5) * spread * Math.cos(angle);
                const z = Math.cos(angle) * handDist - (t - 0.5) * spread * Math.sin(angle);
                const y = 1.4 + (0.25 - Math.pow(t - 0.5, 2)) * 0.2;

                card.position.set(x, y, z);
                card.rotation.y = angle + Math.PI;
                card.rotation.x = -0.3;
                card.rotation.z = (t - 0.5) * 0.1;

                card.userData.orig.pos.copy(card.position);
                card.userData.orig.rot.copy(card.rotation);
                card.userData.index = i;

                handCards.push(card);
                scene.add(card);
            });
        }

        function renderPlayerTabs() {
            const container = document.getElementById('player-tabs');
            container.innerHTML = '';
            game.players.forEach((p, i) => {
                const btn = document.createElement('button');
                btn.className = 'player-tab' + (i === viewingPlayer ? ' active' : '') + (i === game.currentPlayer ? ' current-turn' : '');
                btn.textContent = `${p.name} ${i === game.currentPlayer ? '⭐' : ''}`;
                btn.onclick = () => {
                    viewingPlayer = i;
                    cameraAngle = (i / game.players.length) * Math.PI * 2 - Math.PI / 2 + Math.PI;
                    updateCamera();
                    renderPlayerTabs();
                };
                container.appendChild(btn);
            });
        }

        // ==================== GAME LOGIC ====================
        function createDeck() {
            const deck = [];
            let id = 0;

            CARDS.properties.forEach(p => deck.push({ id: id++, type: 'property', ...p }));
            CARDS.money.forEach(m => { for (let i = 0; i < m.count; i++) deck.push({ id: id++, type: 'money', name: `$${m.value}M`, value: m.value }); });
            CARDS.actions.forEach(a => { for (let i = 0; i < a.count; i++) deck.push({ id: id++, type: 'action', ...a }); });
            CARDS.rent.forEach(r => { for (let i = 0; i < r.count; i++) deck.push({ id: id++, type: 'rent', name: 'Rent', colors: r.colors, value: r.value }); });
            CARDS.wilds.forEach(w => { for (let i = 0; i < w.count; i++) deck.push({ id: id++, type: 'wild', name: 'Wild', colors: w.colors, value: 0 }); });

            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startGame() {
            const count = parseInt(document.getElementById('player-count').value);
            game.deck = createDeck();
            game.players = [];
            game.currentPlayer = 0;
            game.phase = 'draw';
            game.actions = 3;
            game.turnDrawn = false;
            viewingPlayer = 0;

            for (let i = 0; i < count; i++) {
                const p = { name: `Player ${i + 1}`, hand: [], properties: {}, bank: [] };
                for (let j = 0; j < 5; j++) if (game.deck.length) p.hand.push(game.deck.pop());
                game.players.push(p);
            }

            document.getElementById('setup-screen').classList.add('hidden');
            cameraAngle = Math.PI;
            updateCamera();
            createHandCards();
            renderTable();
            renderPlayerTabs();
            updateUI();
        }

        function drawCards() {
            if (game.turnDrawn) return;
            const p = game.players[game.currentPlayer];
            const n = p.hand.length === 0 ? 5 : 2;
            for (let i = 0; i < n; i++) if (game.deck.length) p.hand.push(game.deck.pop());
            game.turnDrawn = true;
            game.phase = 'play';
            createHandCards();
            updateUI();
        }

        function playCard() {
            if (!selectedCard || game.actions <= 0) return;
            const p = game.players[game.currentPlayer];
            const data = selectedCard.userData.cardData;
            const idx = p.hand.findIndex(c => c.id === data.id);
            if (idx === -1) return;

            if (data.type === 'property' || data.type === 'wild') {
                const color = data.color || (data.colors[0] === 'wild' ? 'brown' : data.colors[0]);
                if (!p.properties[color]) p.properties[color] = [];
                p.properties[color].push(data);
                p.hand.splice(idx, 1);
                game.actions--;
                finishPlay();
            } else if (data.type === 'action') {
                executeAction(data, idx);
            } else if (data.type === 'rent') {
                // Simplified rent - just collect from all
                const rentColor = data.colors[0] === 'wild' ? Object.keys(p.properties)[0] : data.colors[0];
                if (rentColor && p.properties[rentColor]) {
                    const amount = p.properties[rentColor].length;
                    game.players.forEach((opp, i) => {
                        if (i !== game.currentPlayer) {
                            collectFromPlayer(opp, amount);
                        }
                    });
                }
                p.hand.splice(idx, 1);
                game.actions--;
                finishPlay();
            } else {
                p.hand.splice(idx, 1);
                game.actions--;
                finishPlay();
            }
        }

        function executeAction(data, idx) {
            const p = game.players[game.currentPlayer];

            switch (data.action) {
                case 'passGo':
                    for (let i = 0; i < 2; i++) if (game.deck.length) p.hand.push(game.deck.pop());
                    p.hand.splice(idx, 1);
                    game.actions--;
                    finishPlay();
                    break;

                case 'birthday':
                    game.players.forEach((opp, i) => {
                        if (i !== game.currentPlayer) collectFromPlayer(opp, 2);
                    });
                    p.hand.splice(idx, 1);
                    game.actions--;
                    finishPlay();
                    break;

                case 'debtCollector':
                    showPlayerSelector('Collect $5M from:', opp => {
                        collectFromPlayer(game.players[opp], 5);
                        p.hand.splice(idx, 1);
                        game.actions--;
                        finishPlay();
                    });
                    break;

                case 'slyDeal':
                    showPlayerSelector('Steal property from:', oppIdx => {
                        const opp = game.players[oppIdx];
                        const colors = Object.keys(opp.properties).filter(c =>
                            opp.properties[c].length > 0 && opp.properties[c].length < COLORS[c].size
                        );
                        if (colors.length > 0) {
                            const color = colors[0];
                            const stolen = opp.properties[color].pop();
                            if (!p.properties[color]) p.properties[color] = [];
                            p.properties[color].push(stolen);
                            if (opp.properties[color].length === 0) delete opp.properties[color];
                        }
                        p.hand.splice(idx, 1);
                        game.actions--;
                        finishPlay();
                    });
                    break;

                case 'dealBreaker':
                    showPlayerSelector('Steal complete set from:', oppIdx => {
                        const opp = game.players[oppIdx];
                        const complete = Object.keys(opp.properties).find(c => opp.properties[c].length >= COLORS[c].size);
                        if (complete) {
                            p.properties[complete] = opp.properties[complete];
                            delete opp.properties[complete];
                        }
                        p.hand.splice(idx, 1);
                        game.actions--;
                        finishPlay();
                    });
                    break;

                default:
                    p.hand.splice(idx, 1);
                    game.actions--;
                    finishPlay();
            }
        }

        function collectFromPlayer(player, amount) {
            let remaining = amount;
            // First from bank
            while (remaining > 0 && player.bank.length > 0) {
                const card = player.bank.pop();
                game.players[game.currentPlayer].bank.push(card);
                remaining -= card.value;
            }
            // Then from properties if needed
            if (remaining > 0) {
                for (const color in player.properties) {
                    while (remaining > 0 && player.properties[color].length > 0) {
                        const card = player.properties[color].pop();
                        if (!game.players[game.currentPlayer].properties[color]) {
                            game.players[game.currentPlayer].properties[color] = [];
                        }
                        game.players[game.currentPlayer].properties[color].push(card);
                        remaining -= card.value;
                    }
                    if (player.properties[color].length === 0) delete player.properties[color];
                }
            }
        }

        function showPlayerSelector(title, callback) {
            const modal = document.getElementById('action-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = 'Select a player:';
            const opts = document.getElementById('modal-options');
            opts.innerHTML = '';

            game.players.forEach((p, i) => {
                if (i !== game.currentPlayer) {
                    const btn = document.createElement('button');
                    btn.className = 'modal-option';
                    btn.textContent = p.name;
                    btn.onclick = () => {
                        modal.classList.remove('visible');
                        callback(i);
                    };
                    opts.appendChild(btn);
                }
            });

            const cancel = document.createElement('button');
            cancel.className = 'modal-option';
            cancel.textContent = 'Cancel';
            cancel.onclick = () => modal.classList.remove('visible');
            opts.appendChild(cancel);

            modal.classList.add('visible');
        }

        function finishPlay() {
            selectedCard = null;
            createHandCards();
            renderTable();
            updateUI();
            checkWin();
        }

        function bankCard() {
            if (!selectedCard || game.actions <= 0) return;
            const p = game.players[game.currentPlayer];
            const data = selectedCard.userData.cardData;
            const idx = p.hand.findIndex(c => c.id === data.id);
            if (idx === -1) return;

            p.bank.push(data);
            p.hand.splice(idx, 1);
            game.actions--;
            selectedCard = null;
            createHandCards();
            renderTable();
            updateUI();
        }

        function endTurn() {
            const p = game.players[game.currentPlayer];
            if (p.hand.length > 7) {
                game.phase = 'discard';
                updateUI();
                return;
            }
            nextTurn();
        }

        function nextTurn() {
            game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
            game.actions = 3;
            game.phase = 'draw';
            game.turnDrawn = false;
            selectedCard = null;
            viewingPlayer = game.currentPlayer;
            cameraAngle = (game.currentPlayer / game.players.length) * Math.PI * 2 - Math.PI / 2 + Math.PI;
            updateCamera();
            createHandCards();
            renderTable();
            renderPlayerTabs();
            updateUI();
        }

        function checkWin() {
            const p = game.players[game.currentPlayer];
            let sets = 0;
            for (const c in p.properties) if (p.properties[c].length >= COLORS[c].size) sets++;
            if (sets >= 3) {
                document.getElementById('winner-name').textContent = `${p.name} Wins!`;
                document.getElementById('winner-screen').classList.add('visible');
            }
        }

        function updateUI() {
            const p = game.players[game.currentPlayer];
            document.getElementById('hud-turn').textContent = `P${game.currentPlayer + 1}`;
            document.getElementById('hud-actions').textContent = game.actions;
            document.getElementById('hud-cards').textContent = p.hand.length;

            let sets = 0;
            for (const c in p.properties) if (p.properties[c].length >= COLORS[c].size) sets++;
            document.getElementById('hud-sets').textContent = `${sets}/3`;

            const bank = p.bank.reduce((s, c) => s + (c.value || 0), 0);
            document.getElementById('hud-bank').textContent = `$${bank}M`;

            document.getElementById('btn-draw').disabled = game.turnDrawn;
            document.getElementById('btn-play').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-bank').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-end').disabled = !game.turnDrawn;

            let inst = '';
            if (game.phase === 'discard') inst = `Discard ${p.hand.length - 7} cards - click to discard`;
            else if (!game.turnDrawn) inst = 'Click DRAW CARDS to start your turn';
            else if (selectedCard) inst = 'PLAY = property/action • BANK = money pile';
            else if (game.actions > 0) inst = `Click a card to select • ${game.actions} actions left`;
            else inst = 'Click END TURN';
            document.getElementById('instructions').textContent = inst;
        }

        // ==================== INTERACTION ====================
        function onMouseMove(e) {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                cameraAngle -= dx * 0.005;
                cameraHeight = Math.max(1.5, Math.min(6, cameraHeight - dy * 0.01));
                updateCamera();
                createHandCards(); // Reposition hand to follow camera
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                return;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(handCards, true);

            if (hoveredCard && hoveredCard !== selectedCard) animateCard(hoveredCard, 'idle');
            hoveredCard = null;

            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj.parent && !obj.userData.isCard) obj = obj.parent;
                if (obj.userData.isCard) {
                    hoveredCard = obj;
                    if (hoveredCard !== selectedCard) animateCard(hoveredCard, 'hover');
                    showTooltip(obj.userData.cardData);
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }
            hideTooltip();
            document.body.style.cursor = isDragging ? 'grabbing' : 'grab';
        }

        function onClick(e) {
            if (isDragging) return;

            if (game.phase === 'discard' && hoveredCard) {
                const p = game.players[game.currentPlayer];
                const idx = p.hand.findIndex(c => c.id === hoveredCard.userData.cardData.id);
                if (idx !== -1) {
                    p.hand.splice(idx, 1);
                    if (p.hand.length <= 7) nextTurn();
                    else { createHandCards(); updateUI(); }
                }
                return;
            }

            if (!hoveredCard) {
                if (selectedCard) { animateCard(selectedCard, 'idle'); selectedCard = null; updateUI(); }
                return;
            }

            if (selectedCard === hoveredCard) {
                animateCard(selectedCard, 'idle');
                selectedCard = null;
            } else {
                if (selectedCard) animateCard(selectedCard, 'idle');
                selectedCard = hoveredCard;
                animateCard(selectedCard, 'select');
            }
            updateUI();
        }

        function animateCard(card, state) {
            const target = card.userData.orig.pos.clone();
            const rot = card.userData.orig.rot.clone();

            if (state === 'select') {
                target.y += 0.15;
                const dir = new THREE.Vector3().subVectors(camera.position, target).normalize();
                target.add(dir.multiplyScalar(0.2));
            } else if (state === 'hover') {
                target.y += 0.08;
            }

            animateTo(card, target, rot, 120);
        }

        function animateTo(obj, pos, rot, dur) {
            const sp = obj.position.clone(), sr = obj.rotation.clone();
            const start = Date.now();
            function update() {
                const t = Math.min((Date.now() - start) / dur, 1);
                const e = 1 - Math.pow(1 - t, 3);
                obj.position.lerpVectors(sp, pos, e);
                obj.rotation.x = sr.x + (rot.x - sr.x) * e;
                obj.rotation.y = sr.y + (rot.y - sr.y) * e;
                obj.rotation.z = sr.z + (rot.z - sr.z) * e;
                if (t < 1) requestAnimationFrame(update);
            }
            update();
        }

        function showTooltip(data) {
            const t = document.getElementById('card-tooltip');
            document.getElementById('tooltip-title').textContent = data.name;
            let desc = '';
            if (data.type === 'property') desc = `${COLORS[data.color].name} Property`;
            else if (data.type === 'money') desc = 'Add to bank';
            else if (data.type === 'action') desc = data.description || data.desc || '';
            else if (data.type === 'rent') desc = 'Charge rent';
            else if (data.type === 'wild') desc = 'Wild property';
            document.getElementById('tooltip-desc').textContent = desc;
            document.getElementById('tooltip-value').textContent = `Value: $${data.value}M`;
            t.classList.add('visible');
        }

        function hideTooltip() { document.getElementById('card-tooltip').classList.remove('visible'); }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
