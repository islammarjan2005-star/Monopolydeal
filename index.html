<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Deal - 3D Immersive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }

        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #ui-overlay > * { pointer-events: auto; }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            border-radius: 20px;
            color: white;
            display: flex;
            gap: 50px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,215,0,0.1);
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .hud-value { font-size: 28px; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .hud-label { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }

        /* Player Info */
        #player-info {
            position: absolute;
            top: 20px; left: 30px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 20px 30px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        #player-info .name { font-size: 22px; font-weight: bold; color: #ffd700; }
        #player-info .turn-text { font-size: 13px; opacity: 0.7; margin-top: 5px; }

        /* Action Buttons */
        #action-buttons {
            position: absolute;
            bottom: 220px; right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn {
            background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(10,10,10,0.98) 100%);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: white;
            padding: 16px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }
        .action-btn:hover {
            background: linear-gradient(180deg, rgba(255,215,0,0.25) 0%, rgba(255,215,0,0.1) 100%);
            border-color: #ffd700;
            transform: translateX(-5px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }
        .action-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
        .action-btn.primary { border-color: #4CAF50; }
        .action-btn.primary:hover { box-shadow: 0 0 30px rgba(76, 175, 80, 0.5); }

        /* Card Info Tooltip */
        #card-tooltip {
            position: absolute;
            top: 100px; left: 30px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            padding: 20px 25px;
            border-radius: 15px;
            color: white;
            min-width: 280px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #card-tooltip.visible { display: block; }
        #card-tooltip h3 { color: #ffd700; margin-bottom: 10px; font-size: 18px; }
        #card-tooltip p { font-size: 14px; opacity: 0.85; line-height: 1.6; }
        #card-tooltip .card-value-display {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #4CAF50;
            font-weight: bold;
        }

        /* Instructions */
        #instructions {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        /* Setup Screen */
        #setup-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a2040 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #setup-screen.hidden { display: none; }
        .setup-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(30px);
            padding: 60px;
            border-radius: 30px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
        }
        .setup-box h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            letter-spacing: 4px;
        }
        .setup-box h2 {
            color: white;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 50px;
            opacity: 0.7;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .setup-box label { color: white; font-size: 16px; display: block; margin-bottom: 15px; text-align: left; }
        .setup-box select {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            margin-bottom: 35px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .setup-box select:hover { border-color: #ffd700; }
        .setup-box select option { background: #1a1a2e; }
        #start-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            color: #000;
            padding: 20px 60px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.7);
        }

        /* Winner Screen */
        #winner-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        #winner-screen.visible { display: flex; }
        .winner-box { text-align: center; }
        .winner-box h1 {
            font-size: 72px;
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .winner-box p { font-size: 28px; color: white; margin-bottom: 50px; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            transition: opacity 0.5s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 70px; height: 70px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: white; margin-top: 25px; font-size: 16px; letter-spacing: 2px; }

        /* Properties Panel */
        #properties-panel {
            position: absolute;
            top: 20px; right: 30px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            color: white;
            min-width: 200px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            max-height: 300px;
            overflow-y: auto;
        }
        #properties-panel h4 { color: #ffd700; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .prop-set {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .prop-set.complete { border: 1px solid #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .prop-color {
            width: 24px; height: 24px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .prop-count { font-size: 13px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <p>Loading 3D Environment...</p>
    </div>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>MONOPOLY DEAL</h1>
            <h2>3D First Person</h2>
            <label>Number of Players</label>
            <select id="player-count">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>
            <button id="start-btn">Enter Game</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="ui-overlay">
        <div id="player-info">
            <div class="name" id="player-name">Player 1</div>
            <div class="turn-text">Your Turn</div>
        </div>

        <div id="hud">
            <div class="hud-stat">
                <span class="hud-value" id="hud-actions">3</span>
                <span class="hud-label">Actions</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-cards">5</span>
                <span class="hud-label">In Hand</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-sets">0/3</span>
                <span class="hud-label">Sets</span>
            </div>
            <div class="hud-stat">
                <span class="hud-value" id="hud-bank">$0M</span>
                <span class="hud-label">Bank</span>
            </div>
        </div>

        <div id="properties-panel">
            <h4>Your Properties</h4>
            <div id="prop-list"></div>
        </div>

        <div id="card-tooltip">
            <h3 id="tooltip-title">Card Name</h3>
            <p id="tooltip-desc">Card description</p>
            <div class="card-value-display" id="tooltip-value"></div>
        </div>

        <div id="action-buttons">
            <button class="action-btn primary" id="btn-draw">Draw Cards</button>
            <button class="action-btn" id="btn-play">Play Card</button>
            <button class="action-btn" id="btn-bank">Bank Card</button>
            <button class="action-btn" id="btn-end">End Turn</button>
        </div>

        <div id="instructions">
            Hover over cards to inspect • Click to select • Space to play selected card
        </div>
    </div>

    <div id="winner-screen">
        <div class="winner-box">
            <h1>🏆 WINNER! 🏆</h1>
            <p id="winner-name">Player 1 Wins!</p>
            <button class="action-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // ===================== CARD DATA =====================
        const CARD_DATA = {
            properties: [
                { name: 'Mediterranean Avenue', color: 'brown', value: 1 },
                { name: 'Baltic Avenue', color: 'brown', value: 1 },
                { name: 'Oriental Avenue', color: 'lightBlue', value: 1 },
                { name: 'Vermont Avenue', color: 'lightBlue', value: 1 },
                { name: 'Connecticut Avenue', color: 'lightBlue', value: 1 },
                { name: 'St. Charles Place', color: 'pink', value: 2 },
                { name: 'States Avenue', color: 'pink', value: 2 },
                { name: 'Virginia Avenue', color: 'pink', value: 2 },
                { name: 'St. James Place', color: 'orange', value: 2 },
                { name: 'Tennessee Avenue', color: 'orange', value: 2 },
                { name: 'New York Avenue', color: 'orange', value: 2 },
                { name: 'Kentucky Avenue', color: 'red', value: 3 },
                { name: 'Indiana Avenue', color: 'red', value: 3 },
                { name: 'Illinois Avenue', color: 'red', value: 3 },
                { name: 'Atlantic Avenue', color: 'yellow', value: 3 },
                { name: 'Ventnor Avenue', color: 'yellow', value: 3 },
                { name: 'Marvin Gardens', color: 'yellow', value: 3 },
                { name: 'Pacific Avenue', color: 'green', value: 4 },
                { name: 'North Carolina Avenue', color: 'green', value: 4 },
                { name: 'Pennsylvania Avenue', color: 'green', value: 4 },
                { name: 'Park Place', color: 'blue', value: 4 },
                { name: 'Boardwalk', color: 'blue', value: 4 },
                { name: 'Reading Railroad', color: 'railroad', value: 2 },
                { name: 'Pennsylvania Railroad', color: 'railroad', value: 2 },
                { name: 'B&O Railroad', color: 'railroad', value: 2 },
                { name: 'Short Line', color: 'railroad', value: 2 },
                { name: 'Electric Company', color: 'utility', value: 2 },
                { name: 'Water Works', color: 'utility', value: 2 },
            ],
            money: [
                { value: 1, count: 6 },
                { value: 2, count: 5 },
                { value: 3, count: 3 },
                { value: 4, count: 3 },
                { value: 5, count: 2 },
                { value: 10, count: 1 },
            ],
            actions: [
                { name: 'Deal Breaker', desc: 'Steal a complete property set from any player!', value: 5, count: 2 },
                { name: 'Just Say No', desc: 'Cancel any action played against you', value: 4, count: 3 },
                { name: 'Sly Deal', desc: 'Steal a property from another player', value: 3, count: 3 },
                { name: 'Forced Deal', desc: 'Swap one of your properties with another player', value: 3, count: 4 },
                { name: 'Debt Collector', desc: 'Force any player to pay you $5M', value: 3, count: 3 },
                { name: "It's My Birthday", desc: 'All other players pay you $2M each', value: 2, count: 3 },
                { name: 'Pass Go', desc: 'Draw 2 extra cards from the deck', value: 1, count: 10 },
                { name: 'House', desc: 'Add to a complete set to increase rent by $3M', value: 3, count: 3 },
                { name: 'Hotel', desc: 'Add to a set with house to increase rent by $4M', value: 4, count: 2 },
                { name: 'Double Rent', desc: 'Play with rent card to double the amount', value: 1, count: 2 },
            ],
            rent: [
                { colors: ['brown', 'lightBlue'], value: 1, count: 2 },
                { colors: ['pink', 'orange'], value: 1, count: 2 },
                { colors: ['red', 'yellow'], value: 1, count: 2 },
                { colors: ['green', 'blue'], value: 1, count: 2 },
                { colors: ['railroad', 'utility'], value: 1, count: 2 },
                { colors: ['wild'], value: 3, count: 3 },
            ],
            wilds: [
                { colors: ['brown', 'lightBlue'], count: 1 },
                { colors: ['pink', 'orange'], count: 2 },
                { colors: ['red', 'yellow'], count: 2 },
                { colors: ['green', 'blue'], count: 1 },
                { colors: ['green', 'railroad'], count: 1 },
                { colors: ['lightBlue', 'railroad'], count: 1 },
                { colors: ['railroad', 'utility'], count: 1 },
                { colors: ['wild'], count: 2 },
            ]
        };

        const COLOR_VALUES = {
            brown: { hex: 0x8B4513, name: 'Brown', size: 2 },
            lightBlue: { hex: 0x87CEEB, name: 'Light Blue', size: 3 },
            pink: { hex: 0xFF69B4, name: 'Pink', size: 3 },
            orange: { hex: 0xFF8C00, name: 'Orange', size: 3 },
            red: { hex: 0xDC143C, name: 'Red', size: 3 },
            yellow: { hex: 0xFFD700, name: 'Yellow', size: 3 },
            green: { hex: 0x228B22, name: 'Green', size: 3 },
            blue: { hex: 0x0000CD, name: 'Dark Blue', size: 2 },
            railroad: { hex: 0x2F2F2F, name: 'Railroad', size: 4 },
            utility: { hex: 0x90EE90, name: 'Utility', size: 2 }
        };

        // ===================== THREE.JS SETUP =====================
        let scene, camera, renderer;
        let raycaster, mouse;
        let handCards = [], tableCards = [];
        let selectedCard = null, hoveredCard = null;
        let envMap;

        // Game state
        let game = {
            players: [],
            currentPlayer: 0,
            deck: [],
            discardPile: [],
            phase: 'draw',
            actions: 3,
            turnDrawn: false
        };

        // Card dimensions (poker card ratio)
        const CARD_WIDTH = 0.635;
        const CARD_HEIGHT = 0.889;
        const CARD_DEPTH = 0.01;

        // ===================== INITIALIZATION =====================
        init();

        function init() {
            // Scene setup
            scene = new THREE.Scene();

            // Camera - First person POV
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.8, 2.8);
            camera.lookAt(0, 0.9, 0);

            // Renderer with high quality
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.physicallyCorrectLights = true;

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create environment
            createEnvironment();
            createLighting();
            createEnvMap();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onMouseClick);
            window.addEventListener('keydown', onKeyDown);

            // UI Events
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('btn-draw').addEventListener('click', drawCards);
            document.getElementById('btn-play').addEventListener('click', playSelectedCard);
            document.getElementById('btn-bank').addEventListener('click', bankSelectedCard);
            document.getElementById('btn-end').addEventListener('click', endTurn);

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);

            // Animation loop
            animate();
        }

        function createEnvMap() {
            // Create a simple environment map for reflections
            const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
            cubeRenderTarget.texture.type = THREE.HalfFloatType;

            // Simple gradient environment
            const envScene = new THREE.Scene();
            const envGeo = new THREE.SphereGeometry(50, 32, 32);
            const envMat = new THREE.MeshBasicMaterial({
                side: THREE.BackSide,
                color: 0x1a1a2e
            });
            envScene.add(new THREE.Mesh(envGeo, envMat));

            // Add some colored lights to env
            const light1 = new THREE.PointLight(0xffd700, 2, 30);
            light1.position.set(0, 10, 0);
            envScene.add(light1);
        }

        function createEnvironment() {
            // Ambient background gradient
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 5, 25);

            // Casino room walls
            const roomGeo = new THREE.BoxGeometry(20, 10, 20);
            const roomMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                side: THREE.BackSide,
                roughness: 0.9,
                metalness: 0.1
            });
            const room = new THREE.Mesh(roomGeo, roomMat);
            room.position.y = 5;
            scene.add(room);

            // Poker table
            createTable();

            // Floor
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x1a0a0a,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Add deck on table
            createDeckMesh();

            // Add atmospheric particles
            createParticles();
        }

        function createTable() {
            const tableGroup = new THREE.Group();

            // Felt surface
            const feltGeo = new THREE.CylinderGeometry(2.2, 2.2, 0.08, 64);
            const feltMat = new THREE.MeshStandardMaterial({
                color: 0x0d5c0d,
                roughness: 0.85,
                metalness: 0.0
            });
            const felt = new THREE.Mesh(feltGeo, feltMat);
            felt.position.y = 0.76;
            felt.receiveShadow = true;
            tableGroup.add(felt);

            // Wooden rim
            const rimGeo = new THREE.TorusGeometry(2.25, 0.08, 16, 64);
            const woodMat = new THREE.MeshStandardMaterial({
                color: 0x3d1f0d,
                roughness: 0.4,
                metalness: 0.3
            });
            const rim = new THREE.Mesh(rimGeo, woodMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.8;
            rim.castShadow = true;
            tableGroup.add(rim);

            // Inner gold ring
            const goldRimGeo = new THREE.TorusGeometry(2.15, 0.02, 8, 64);
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                roughness: 0.2,
                metalness: 0.9,
                emissive: 0xffd700,
                emissiveIntensity: 0.1
            });
            const goldRim = new THREE.Mesh(goldRimGeo, goldMat);
            goldRim.rotation.x = Math.PI / 2;
            goldRim.position.y = 0.81;
            tableGroup.add(goldRim);

            // Table pedestal
            const pedestalGeo = new THREE.CylinderGeometry(0.8, 1.0, 0.72, 32);
            const pedestal = new THREE.Mesh(pedestalGeo, woodMat);
            pedestal.position.y = 0.36;
            pedestal.castShadow = true;
            tableGroup.add(pedestal);

            // Base
            const baseGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.1, 32);
            const base = new THREE.Mesh(baseGeo, woodMat);
            base.position.y = 0.05;
            base.castShadow = true;
            base.receiveShadow = true;
            tableGroup.add(base);

            scene.add(tableGroup);
        }

        function createLighting() {
            // Ambient
            const ambient = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambient);

            // Main overhead lamp
            const mainLight = new THREE.SpotLight(0xfff5e0, 3);
            mainLight.position.set(0, 5, 0);
            mainLight.angle = Math.PI / 4;
            mainLight.penumbra = 0.6;
            mainLight.decay = 1.5;
            mainLight.distance = 12;
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 1;
            mainLight.shadow.camera.far = 12;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            // Lamp shade
            const shadeGeo = new THREE.ConeGeometry(0.7, 0.4, 32, 1, true);
            const shadeMat = new THREE.MeshStandardMaterial({
                color: 0x1a5c1a,
                side: THREE.DoubleSide,
                roughness: 0.6,
                metalness: 0.4,
                emissive: 0x0a2a0a,
                emissiveIntensity: 0.3
            });
            const shade = new THREE.Mesh(shadeGeo, shadeMat);
            shade.position.set(0, 4.3, 0);
            shade.rotation.x = Math.PI;
            scene.add(shade);

            // Gold trim on lamp
            const lampRimGeo = new THREE.TorusGeometry(0.7, 0.03, 8, 32);
            const lampRimMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                roughness: 0.2,
                metalness: 0.9
            });
            const lampRim = new THREE.Mesh(lampRimGeo, lampRimMat);
            lampRim.position.set(0, 4.1, 0);
            lampRim.rotation.x = Math.PI / 2;
            scene.add(lampRim);

            // Accent lights
            const accentColors = [0xff6b6b, 0x6b6bff, 0xffd700];
            accentColors.forEach((color, i) => {
                const light = new THREE.PointLight(color, 0.4, 8);
                const angle = (i / 3) * Math.PI * 2;
                light.position.set(Math.cos(angle) * 4, 3, Math.sin(angle) * 4);
                scene.add(light);
            });

            // Fill light from player
            const fillLight = new THREE.PointLight(0xffffff, 0.3, 6);
            fillLight.position.set(0, 2, 3.5);
            scene.add(fillLight);
        }

        function createParticles() {
            const particleCount = 200;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 15;
                positions[i * 3 + 1] = Math.random() * 8;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 15;
            }

            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0xffd700,
                size: 0.02,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            particles.userData.isParticles = true;
            scene.add(particles);
        }

        function createDeckMesh() {
            const deckGroup = new THREE.Group();

            // Stack of cards
            for (let i = 0; i < 15; i++) {
                const cardGeo = new THREE.BoxGeometry(CARD_WIDTH, CARD_DEPTH, CARD_HEIGHT);
                const cardMat = new THREE.MeshStandardMaterial({
                    color: 0xcc0000,
                    roughness: 0.3,
                    metalness: 0.2
                });
                const card = new THREE.Mesh(cardGeo, cardMat);
                card.position.y = i * 0.004;
                card.rotation.y = (Math.random() - 0.5) * 0.05;
                card.castShadow = true;
                deckGroup.add(card);
            }

            // Gold design on top card
            const topDesignGeo = new THREE.PlaneGeometry(0.4, 0.4);
            const topDesignMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                roughness: 0.3,
                metalness: 0.8,
                emissive: 0xffd700,
                emissiveIntensity: 0.2
            });
            const topDesign = new THREE.Mesh(topDesignGeo, topDesignMat);
            topDesign.position.y = 0.065;
            topDesign.rotation.x = -Math.PI / 2;
            deckGroup.add(topDesign);

            deckGroup.position.set(-0.9, 0.82, 0);
            deckGroup.userData.isDeck = true;
            scene.add(deckGroup);
        }

        // ===================== CARD CREATION =====================
        function createCard3D(cardData, index) {
            const group = new THREE.Group();

            // Get card color
            let mainColor = 0xffffff;
            let isRainbow = false;

            if (cardData.type === 'property') {
                mainColor = COLOR_VALUES[cardData.color]?.hex || 0xffffff;
            } else if (cardData.type === 'money') {
                mainColor = 0x228B22;
            } else if (cardData.type === 'action') {
                mainColor = 0xFFD700;
            } else if (cardData.type === 'rent') {
                mainColor = 0xDC143C;
            } else if (cardData.type === 'wild') {
                if (cardData.colors.includes('wild') || cardData.colors.length > 2) {
                    isRainbow = true;
                    mainColor = 0x9370DB;
                } else {
                    mainColor = COLOR_VALUES[cardData.colors[0]]?.hex || 0x3498DB;
                }
            }

            // Card base (white)
            const baseGeo = new THREE.BoxGeometry(CARD_WIDTH, CARD_DEPTH, CARD_HEIGHT);
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0xfafafa,
                roughness: 0.15,
                metalness: 0.05
            });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            group.add(baseMesh);

            // Colored header strip
            const headerGeo = new THREE.BoxGeometry(CARD_WIDTH - 0.02, CARD_DEPTH + 0.002, CARD_HEIGHT * 0.35);
            const headerMat = new THREE.MeshStandardMaterial({
                color: mainColor,
                roughness: 0.3,
                metalness: 0.4,
                emissive: mainColor,
                emissiveIntensity: 0.1
            });
            const header = new THREE.Mesh(headerGeo, headerMat);
            header.position.y = CARD_DEPTH / 2 + 0.001;
            header.position.z = -CARD_HEIGHT * 0.3;
            group.add(header);

            // Card border/frame
            const borderGeo = new THREE.BoxGeometry(CARD_WIDTH + 0.015, CARD_DEPTH - 0.002, CARD_HEIGHT + 0.015);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.4,
                metalness: 0.5
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.y = -0.001;
            group.add(border);

            // Value indicator circle
            const valueGeo = new THREE.CircleGeometry(0.06, 16);
            const valueMat = new THREE.MeshStandardMaterial({
                color: 0x228B22,
                roughness: 0.2,
                metalness: 0.6,
                emissive: 0x228B22,
                emissiveIntensity: 0.2
            });
            const valueCircle = new THREE.Mesh(valueGeo, valueMat);
            valueCircle.position.set(-CARD_WIDTH * 0.35, CARD_DEPTH / 2 + 0.002, CARD_HEIGHT * 0.35);
            valueCircle.rotation.x = -Math.PI / 2;
            group.add(valueCircle);

            // Add shimmer effect for special cards
            if (cardData.type === 'action' || isRainbow) {
                const shimmerGeo = new THREE.PlaneGeometry(CARD_WIDTH - 0.04, CARD_HEIGHT - 0.04);
                const shimmerMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.1,
                    roughness: 0.0,
                    metalness: 1.0
                });
                const shimmer = new THREE.Mesh(shimmerGeo, shimmerMat);
                shimmer.position.y = CARD_DEPTH / 2 + 0.003;
                shimmer.rotation.x = -Math.PI / 2;
                group.add(shimmer);
            }

            // Store card data
            group.userData = {
                cardData: cardData,
                index: index,
                originalPosition: new THREE.Vector3(),
                originalRotation: new THREE.Euler(),
                isCard: true
            };

            return group;
        }

        function createHandCards() {
            // Remove existing hand cards
            handCards.forEach(card => scene.remove(card));
            handCards = [];

            const player = game.players[game.currentPlayer];
            if (!player || !player.hand) return;

            const count = player.hand.length;
            const spreadWidth = Math.min(count * 0.18, 2.2);
            const arcHeight = 0.15;

            player.hand.forEach((cardData, i) => {
                const card = createCard3D(cardData, i);

                // Position in arc at bottom of view
                const t = count > 1 ? i / (count - 1) : 0.5;
                const x = (t - 0.5) * spreadWidth;
                const z = 2.0 + Math.abs(t - 0.5) * 0.3;
                const y = 1.0 - (t - 0.5) * (t - 0.5) * arcHeight;

                card.position.set(x, y, z);
                card.rotation.x = -0.7;
                card.rotation.y = -(t - 0.5) * 0.3;
                card.rotation.z = (t - 0.5) * 0.15;

                card.userData.originalPosition.copy(card.position);
                card.userData.originalRotation.copy(card.rotation);

                handCards.push(card);
                scene.add(card);
            });
        }

        // ===================== GAME LOGIC =====================
        function createDeck() {
            const deck = [];
            let id = 0;

            // Properties
            CARD_DATA.properties.forEach(prop => {
                deck.push({
                    id: id++,
                    type: 'property',
                    name: prop.name,
                    color: prop.color,
                    value: prop.value
                });
            });

            // Money
            CARD_DATA.money.forEach(m => {
                for (let i = 0; i < m.count; i++) {
                    deck.push({
                        id: id++,
                        type: 'money',
                        name: `$${m.value}M`,
                        value: m.value
                    });
                }
            });

            // Actions
            CARD_DATA.actions.forEach(a => {
                for (let i = 0; i < a.count; i++) {
                    deck.push({
                        id: id++,
                        type: 'action',
                        name: a.name,
                        description: a.desc,
                        value: a.value
                    });
                }
            });

            // Rent
            CARD_DATA.rent.forEach(r => {
                for (let i = 0; i < r.count; i++) {
                    deck.push({
                        id: id++,
                        type: 'rent',
                        name: r.colors[0] === 'wild' ? 'Wild Rent' : `Rent Card`,
                        colors: r.colors,
                        value: r.value
                    });
                }
            });

            // Wild properties
            CARD_DATA.wilds.forEach(w => {
                for (let i = 0; i < w.count; i++) {
                    deck.push({
                        id: id++,
                        type: 'wild',
                        name: w.colors[0] === 'wild' ? 'Rainbow Wild' : 'Wild Property',
                        colors: w.colors,
                        value: 0
                    });
                }
            });

            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            return deck;
        }

        function startGame() {
            const playerCount = parseInt(document.getElementById('player-count').value);

            game.deck = createDeck();
            game.players = [];
            game.currentPlayer = 0;
            game.phase = 'draw';
            game.actions = 3;
            game.turnDrawn = false;
            game.discardPile = [];

            // Create players
            for (let i = 0; i < playerCount; i++) {
                game.players.push({
                    id: i,
                    name: `Player ${i + 1}`,
                    hand: [],
                    properties: {},
                    bank: []
                });

                // Deal 5 cards
                for (let j = 0; j < 5; j++) {
                    if (game.deck.length > 0) {
                        game.players[i].hand.push(game.deck.pop());
                    }
                }
            }

            document.getElementById('setup-screen').classList.add('hidden');
            createHandCards();
            updateUI();
        }

        function drawCards() {
            if (game.turnDrawn) return;

            const player = game.players[game.currentPlayer];
            const cardsToDraw = player.hand.length === 0 ? 5 : 2;

            for (let i = 0; i < cardsToDraw; i++) {
                if (game.deck.length > 0) {
                    player.hand.push(game.deck.pop());
                }
            }

            game.turnDrawn = true;
            game.phase = 'play';

            createHandCards();
            animateHandDeal();
            updateUI();
        }

        function animateHandDeal() {
            handCards.forEach((card, i) => {
                const originalPos = card.userData.originalPosition.clone();
                const originalRot = card.userData.originalRotation.clone();

                // Start position (from deck)
                card.position.set(-0.9, 2, 0);
                card.rotation.set(0, 0, 0);

                setTimeout(() => {
                    animateTo(card, originalPos, originalRot, 400);
                }, i * 80);
            });
        }

        function playSelectedCard() {
            if (!selectedCard || game.actions <= 0) return;

            const player = game.players[game.currentPlayer];
            const cardData = selectedCard.userData.cardData;
            const cardIndex = player.hand.findIndex(c => c.id === cardData.id);

            if (cardIndex === -1) return;

            // Handle card type
            if (cardData.type === 'property') {
                if (!player.properties[cardData.color]) {
                    player.properties[cardData.color] = [];
                }
                player.properties[cardData.color].push(cardData);
            } else if (cardData.type === 'wild') {
                const color = cardData.colors[0] === 'wild' ? 'brown' : cardData.colors[0];
                if (!player.properties[color]) {
                    player.properties[color] = [];
                }
                player.properties[color].push({ ...cardData, assignedColor: color });
            } else if (cardData.type === 'action') {
                if (cardData.name === 'Pass Go') {
                    for (let i = 0; i < 2; i++) {
                        if (game.deck.length > 0) {
                            player.hand.push(game.deck.pop());
                        }
                    }
                }
                game.discardPile.push(cardData);
            } else {
                game.discardPile.push(cardData);
            }

            // Remove from hand
            player.hand.splice(cardIndex, 1);
            game.actions--;

            // Animate to table
            animateCardToTable(selectedCard);

            selectedCard = null;

            setTimeout(() => {
                createHandCards();
                updateUI();
                checkWinCondition();
            }, 400);
        }

        function bankSelectedCard() {
            if (!selectedCard || game.actions <= 0) return;

            const player = game.players[game.currentPlayer];
            const cardData = selectedCard.userData.cardData;
            const cardIndex = player.hand.findIndex(c => c.id === cardData.id);

            if (cardIndex === -1) return;

            player.bank.push(cardData);
            player.hand.splice(cardIndex, 1);
            game.actions--;

            animateCardToTable(selectedCard);

            selectedCard = null;

            setTimeout(() => {
                createHandCards();
                updateUI();
            }, 400);
        }

        function animateCardToTable(card) {
            const targetPos = new THREE.Vector3(
                (Math.random() - 0.5) * 0.5,
                0.85,
                (Math.random() - 0.5) * 0.3
            );
            const targetRot = new THREE.Euler(-Math.PI / 2, 0, Math.random() * 0.3);

            animateTo(card, targetPos, targetRot, 350);

            setTimeout(() => {
                scene.remove(card);
            }, 400);
        }

        function animateTo(obj, targetPos, targetRot, duration) {
            const startPos = obj.position.clone();
            const startRot = new THREE.Euler().copy(obj.rotation);
            const startTime = Date.now();

            function update() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic

                obj.position.lerpVectors(startPos, targetPos, ease);
                obj.rotation.x = startRot.x + (targetRot.x - startRot.x) * ease;
                obj.rotation.y = startRot.y + (targetRot.y - startRot.y) * ease;
                obj.rotation.z = startRot.z + (targetRot.z - startRot.z) * ease;

                if (t < 1) requestAnimationFrame(update);
            }
            update();
        }

        function endTurn() {
            const player = game.players[game.currentPlayer];

            // Check hand limit
            if (player.hand.length > 7) {
                game.phase = 'discard';
                document.getElementById('instructions').textContent =
                    `Discard ${player.hand.length - 7} cards - Click cards to discard`;
                return;
            }

            nextTurn();
        }

        function nextTurn() {
            game.currentPlayer = (game.currentPlayer + 1) % game.players.length;
            game.actions = 3;
            game.phase = 'draw';
            game.turnDrawn = false;

            selectedCard = null;
            createHandCards();
            updateUI();
        }

        function checkWinCondition() {
            const player = game.players[game.currentPlayer];
            let completeSets = 0;

            for (const color in player.properties) {
                const required = COLOR_VALUES[color]?.size || 3;
                if (player.properties[color].length >= required) {
                    completeSets++;
                }
            }

            if (completeSets >= 3) {
                document.getElementById('winner-name').textContent = `${player.name} Wins!`;
                document.getElementById('winner-screen').classList.add('visible');
            }
        }

        function updateUI() {
            const player = game.players[game.currentPlayer];
            if (!player) return;

            document.getElementById('player-name').textContent = player.name;
            document.getElementById('hud-actions').textContent = game.actions;
            document.getElementById('hud-cards').textContent = player.hand.length;

            // Calculate sets
            let completeSets = 0;
            for (const color in player.properties) {
                const required = COLOR_VALUES[color]?.size || 3;
                if (player.properties[color].length >= required) {
                    completeSets++;
                }
            }
            document.getElementById('hud-sets').textContent = `${completeSets}/3`;

            // Bank total
            const bankTotal = player.bank.reduce((sum, c) => sum + (c.value || 0), 0);
            document.getElementById('hud-bank').textContent = `$${bankTotal}M`;

            // Properties panel
            let propHtml = '';
            for (const color in player.properties) {
                const cards = player.properties[color];
                const info = COLOR_VALUES[color];
                const isComplete = cards.length >= (info?.size || 3);
                propHtml += `
                    <div class="prop-set ${isComplete ? 'complete' : ''}">
                        <div class="prop-color" style="background: #${info?.hex.toString(16).padStart(6, '0')}"></div>
                        <span class="prop-count">${cards.length}/${info?.size || 3} ${info?.name || color}</span>
                    </div>
                `;
            }
            document.getElementById('prop-list').innerHTML = propHtml || '<span style="opacity:0.5">None yet</span>';

            // Buttons
            document.getElementById('btn-draw').disabled = game.turnDrawn;
            document.getElementById('btn-play').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-bank').disabled = !selectedCard || game.actions <= 0;
            document.getElementById('btn-end').disabled = !game.turnDrawn;

            // Instructions
            if (!game.turnDrawn) {
                document.getElementById('instructions').textContent = 'Press DRAW CARDS to start your turn';
            } else if (game.actions > 0) {
                document.getElementById('instructions').textContent =
                    selectedCard ? 'Press PLAY or BANK • Click elsewhere to deselect' :
                    'Click a card to select it • ' + game.actions + ' actions remaining';
            } else {
                document.getElementById('instructions').textContent = 'No actions left • Press END TURN';
            }
        }

        // ===================== INTERACTION =====================
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(handCards, true);

            // Reset previous hover
            if (hoveredCard && hoveredCard !== selectedCard) {
                animateHover(hoveredCard, false);
            }

            hoveredCard = null;

            if (intersects.length > 0) {
                let card = intersects[0].object;
                while (card.parent && !card.userData.isCard) {
                    card = card.parent;
                }

                if (card.userData.isCard) {
                    hoveredCard = card;
                    if (hoveredCard !== selectedCard) {
                        animateHover(hoveredCard, true);
                    }
                    showTooltip(card.userData.cardData);
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }

            hideTooltip();
            document.body.style.cursor = 'default';
        }

        function onMouseClick() {
            if (game.phase === 'discard' && hoveredCard) {
                // Discard mode
                const player = game.players[game.currentPlayer];
                const cardData = hoveredCard.userData.cardData;
                const idx = player.hand.findIndex(c => c.id === cardData.id);
                if (idx !== -1) {
                    player.hand.splice(idx, 1);
                    scene.remove(hoveredCard);
                    handCards = handCards.filter(c => c !== hoveredCard);

                    if (player.hand.length <= 7) {
                        nextTurn();
                    } else {
                        createHandCards();
                        updateUI();
                    }
                }
                return;
            }

            if (!hoveredCard) {
                // Deselect
                if (selectedCard) {
                    animateSelect(selectedCard, false);
                    selectedCard = null;
                    updateUI();
                }
                return;
            }

            // Select card
            if (selectedCard && selectedCard !== hoveredCard) {
                animateSelect(selectedCard, false);
            }

            if (selectedCard === hoveredCard) {
                // Deselect same card
                animateSelect(selectedCard, false);
                selectedCard = null;
            } else {
                selectedCard = hoveredCard;
                animateSelect(selectedCard, true);
            }

            updateUI();
        }

        function onKeyDown(event) {
            if (event.code === 'Space' && selectedCard) {
                event.preventDefault();
                playSelectedCard();
            }
        }

        function animateHover(card, isHover) {
            if (card === selectedCard) return;

            const target = card.userData.originalPosition.clone();
            if (isHover) {
                target.y += 0.12;
                target.z -= 0.08;
            }

            animateTo(card, target, card.userData.originalRotation, 150);
        }

        function animateSelect(card, isSelect) {
            const target = card.userData.originalPosition.clone();
            const targetRot = card.userData.originalRotation.clone();

            if (isSelect) {
                target.y += 0.25;
                target.z -= 0.15;
                targetRot.x += 0.15;

                // Glow effect
                card.children.forEach(child => {
                    if (child.material && child.material.emissive) {
                        child.material.emissiveIntensity = 0.4;
                    }
                });
            } else {
                card.children.forEach(child => {
                    if (child.material && child.material.emissive) {
                        child.material.emissiveIntensity = 0.1;
                    }
                });
            }

            animateTo(card, target, targetRot, 200);
        }

        function showTooltip(cardData) {
            const tooltip = document.getElementById('card-tooltip');
            document.getElementById('tooltip-title').textContent = cardData.name;

            let desc = '';
            if (cardData.type === 'property') {
                desc = `${COLOR_VALUES[cardData.color]?.name || cardData.color} Property`;
            } else if (cardData.type === 'money') {
                desc = 'Money Card - Add to your bank';
            } else if (cardData.type === 'action') {
                desc = cardData.description || 'Action Card';
            } else if (cardData.type === 'rent') {
                desc = 'Charge rent to other players';
            } else if (cardData.type === 'wild') {
                desc = 'Wild Property - Can be any color: ' + cardData.colors.join(', ');
            }

            document.getElementById('tooltip-desc').textContent = desc;
            document.getElementById('tooltip-value').textContent = `Value: $${cardData.value}M`;

            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            document.getElementById('card-tooltip').classList.remove('visible');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===================== ANIMATION LOOP =====================
        function animate() {
            requestAnimationFrame(animate);

            // Subtle camera sway
            const time = Date.now() * 0.0003;
            camera.position.x = Math.sin(time) * 0.02;
            camera.position.y = 1.8 + Math.sin(time * 1.3) * 0.01;

            // Rotate particles
            scene.children.forEach(child => {
                if (child.userData.isParticles) {
                    child.rotation.y += 0.0002;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
